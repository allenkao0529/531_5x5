<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>531 課表管理系統</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <!-- 給 Apple iOS (iPhone/iPad) 辨識的 App Icon -->
  <link rel="apple-touch-icon" href="icon-180.png">

  <!-- PWA: Manifest + 安裝提示 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1B2A4A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="531 課表">

  <!-- 給一般瀏覽器與 Android 辨識的網頁 Icon (Favicon) -->
  <link rel="icon" type="image/png" href="icon-512.png">
  <style>
    :root {
      /* ── 色彩系統 ── */
      --bg:        #FAF8F5;
      --surface:   #FFFFFF;
      --navy:      #1B2A4A;
      --navy-light:#2C4168;
      --accent:    #C62828;
      --accent-lt: #EF5350;
      --teal:      #00796B;
      --teal-lt:   #26A69A;
      --muted:     #6B7B8D;
      --border:    #E8E4DF;
      --squats:    #1565C0;
      --press:     #2E7D32;
      --deadlift:  #E65100;
      --bench:     #AD1457;
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--bg);
      padding: 10px 10px 85px 10px;
      font-family: 'Noto Sans TC', -apple-system, sans-serif;
      font-size: 16px;
      color: var(--navy);
      -webkit-font-smoothing: antialiased;
    }

    /* ── 數字等寬 ── */
    .mono {
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
      font-variant-numeric: tabular-nums;
    }

    .content-wrapper { max-width: 600px; margin: 0 auto; }
    .my-tab { display: block; }

    /* ── 卡片 ── */
    .card {
      border: none;
      border-radius: 14px;
      box-shadow: 0 1px 4px rgba(27,42,74,0.06), 0 4px 16px rgba(27,42,74,0.04);
      margin-bottom: 16px;
      overflow: hidden;
      transition: transform 0.15s ease;
    }

    /* ── 底部導航 ── */
    .bottom-nav {
      position: fixed; bottom: 0; width: 100%;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-around;
      padding: 6px 0 10px 0; z-index: 1000;
    }
    .nav-item {
      text-align: center; color: var(--muted);
      text-decoration: none; font-size: 11px;
      flex: 1; transition: color 0.2s ease;
      position: relative; padding-top: 4px;
    }
    .nav-item .nav-icon { font-size: 18px; display: block; margin-bottom: 2px; }
    .nav-item.active {
      color: var(--navy); font-weight: 700;
    }
    .nav-item.active::after {
      content: ''; position: absolute;
      bottom: -10px; left: 50%; transform: translateX(-50%);
      width: 20px; height: 3px; border-radius: 2px;
      background: var(--accent);
    }

    /* ── 日曆 ── */
    .calendar-grid {
      display: grid; grid-template-columns: repeat(7, 1fr);
      gap: 1px; background: var(--border);
      border: 1px solid var(--border);
      border-radius: 10px; overflow: hidden;
    }
    #tab-cal { margin-left: 0; margin-right: 0; }
    #tab-cal .card { border-radius: 0; box-shadow: none; }
    .cal-day {
      background: var(--surface);
      min-height: 80px; padding: 6px 4px;
      font-size: 11px; position: relative;
      transition: background 0.15s ease;
    }
    .cal-day:active { background: #f5f3f0; }
    .cal-header {
      background: var(--navy); color: #fff;
      text-align: center; font-weight: 700;
      padding: 8px 2px; font-size: 11px;
      letter-spacing: 0.5px;
    }
    .cal-today { background: #FFF8E1 !important; }
    .cal-today .cal-day-num {
      background: var(--accent); color: #fff;
      width: 24px; height: 24px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .cal-day-num {
      font-weight: 600; font-size: 12px;
      display: block; margin-bottom: 2px;
    }
    .cal-event {
      background: #E3F2FD; color: var(--squats);
      border-radius: 5px; padding: 3px 5px;
      margin-top: 2px; font-size: 9px;
      line-height: 1.3; font-weight: 600;
      border-left: 2px solid var(--squats);
      transition: transform 0.1s ease;
    }
    .cal-event:active { transform: scale(0.97); }
    .cal-event.move-deadlift { background: #FFF3E0; color: var(--deadlift); border-left-color: var(--deadlift); }
    .cal-event.move-press  { background: #E8F5E9; color: var(--press); border-left-color: var(--press); }
    .cal-event.move-bench  { background: #FCE4EC; color: var(--bench); border-left-color: var(--bench); }
    .cal-done {
      background: #E8F5E9 !important; color: var(--teal) !important;
      border-left-color: var(--teal) !important;
      opacity: 0.7;
    }
    .cal-done::after { content: ' \2713'; font-weight: 900; }
    .cal-week-tag {
      font-size: 9px; color: var(--muted);
      display: block; margin-bottom: 1px; font-weight: 700;
    }

    /* ── Loader ── */
    #loader {
      display: none; position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(250,248,245,0.92);
      z-index: 9999; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .loader-spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loaderText {
      font-weight: 500; color: var(--muted);
      margin-top: 12px; font-size: 13px;
    }

    /* ── 登入畫面 ── */
    #loginScreen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--navy);
      z-index: 1000; display: flex;
      flex-direction: column; align-items: center; justify-content: center;
      padding: 24px;
      overflow: hidden;
    }
    #loginScreen::before {
      content: ''; position: absolute; top: -40%; right: -20%;
      width: 500px; height: 500px; border-radius: 50%;
      background: radial-gradient(circle, rgba(198,40,40,0.15) 0%, transparent 70%);
      pointer-events: none;
    }
    #loginScreen::after {
      content: ''; position: absolute; bottom: -30%; left: -15%;
      width: 400px; height: 400px; border-radius: 50%;
      background: radial-gradient(circle, rgba(0,121,107,0.12) 0%, transparent 70%);
      pointer-events: none;
    }
    .login-box {
      background: var(--surface);
      padding: 40px 32px 36px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      width: 100%; max-width: 380px;
      text-align: center;
      position: relative; z-index: 1;
      animation: slideUp 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .login-brand {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 56px; font-weight: 600;
      color: var(--navy); line-height: 1;
      margin-bottom: 4px; letter-spacing: -2px;
    }
    .login-brand span { color: var(--accent); }
    .login-subtitle {
      font-size: 13px; color: var(--muted);
      margin-bottom: 28px; font-weight: 400;
      letter-spacing: 1px;
    }
    .login-pwd {
      -webkit-text-security: disc;
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 16px;
      font-family: 'IBM Plex Mono', monospace;
      text-align: center;
      letter-spacing: 4px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      background: var(--bg);
    }
    .login-pwd:focus {
      outline: none;
      border-color: var(--navy);
      box-shadow: 0 0 0 3px rgba(27,42,74,0.1);
    }
    .login-btn {
      background: var(--navy); color: #fff;
      border: none; border-radius: 10px;
      padding: 14px; font-size: 16px;
      font-weight: 700; font-family: 'Noto Sans TC', sans-serif;
      letter-spacing: 2px;
      transition: background 0.2s ease, transform 0.1s ease;
      width: 100%; margin-top: 12px;
    }
    .login-btn:active {
      transform: scale(0.98);
      background: var(--navy-light);
    }

    /* ── Tab 切換動畫 ── */
    .my-tab { animation: tabIn 0.25s ease; }
    @keyframes tabIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── 動作卡片 ── */
    .workout-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 10px;
      background: var(--surface);
      transition: box-shadow 0.2s ease;
    }
    .workout-card:active { box-shadow: 0 2px 12px rgba(27,42,74,0.1); }
    .workout-card-header {
      display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 12px;
    }
    .workout-move-name {
      font-weight: 700; font-size: 16px; color: var(--navy);
    }
    .workout-set-badge {
      background: var(--bg); color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 6px; padding: 2px 10px;
      font-size: 11px; font-weight: 600;
    }
    .workout-plan {
      font-size: 12px; color: var(--muted);
      margin-bottom: 12px;
    }
    .workout-plan strong { color: var(--navy); }
    .workout-inputs {
      display: flex; gap: 8px; align-items: flex-end;
    }
    .workout-input-group label {
      display: block; font-size: 10px;
      color: var(--muted); margin-bottom: 3px;
      font-weight: 500; text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .workout-input-group input {
      border: 2px solid var(--border);
      border-radius: 8px; padding: 10px 8px;
      text-align: center; font-size: 18px;
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 600; color: var(--navy);
      background: var(--bg);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      width: 100%;
    }
    .workout-input-group input:focus {
      outline: none;
      border-color: var(--navy);
      box-shadow: 0 0 0 3px rgba(27,42,74,0.08);
    }
    .workout-btn {
      border: none; border-radius: 8px;
      padding: 12px 0; font-size: 15px;
      font-weight: 700; font-family: 'Noto Sans TC', sans-serif;
      transition: transform 0.1s ease, background 0.2s ease;
      flex: 1; letter-spacing: 1px;
    }
    .workout-btn:active { transform: scale(0.96); }
    .workout-btn.btn-log {
      background: var(--navy); color: #fff;
    }
    .workout-btn.btn-log:active { background: var(--navy-light); }
    .workout-btn.btn-done {
      background: var(--teal); color: #fff;
    }

    /* ── 暖身組 ── */
    .warmup-block {
      background: linear-gradient(135deg, #F0F7F4 0%, #E8F5F0 100%);
      border: 1px dashed var(--teal-lt);
      border-left: 3px solid var(--teal);
      padding: 10px 14px; border-radius: 8px;
      margin-bottom: 10px; font-size: 12px;
    }
    .warmup-label {
      color: var(--teal); font-weight: 700;
      font-size: 11px; letter-spacing: 0.5px;
    }
    .warmup-detail {
      color: var(--navy); margin-top: 3px;
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 500;
    }

    /* ── 1RM 顯示 ── */
    .est-1rm-display {
      background: linear-gradient(135deg, #FFF8E1 0%, #FFF3C7 100%);
      border-radius: 8px; padding: 8px 14px;
      margin-top: 10px; font-size: 12px;
      color: #7B6000; border: 1px solid #FFE082;
    }
    .est-1rm-display .mono { font-weight: 600; }

    /* ── 樂觀更新：同步中動畫 ── */
    .workout-btn.btn-syncing {
      animation: syncPulse 1.2s ease-in-out infinite;
    }
    @keyframes syncPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    /* ── 統計卡片 ── */
    .stat-card {
      background: var(--surface);
      border-radius: 12px; padding: 14px 8px;
      text-align: center;
      box-shadow: 0 1px 4px rgba(27,42,74,0.05);
      border-top: 3px solid var(--navy);
      transition: transform 0.15s ease;
    }
    .stat-card:active { transform: scale(0.97); }
    .stat-card:nth-child(1) { border-top-color: var(--squats); }
    .stat-card:nth-child(2) { border-top-color: var(--press); }
    .stat-card:nth-child(3) { border-top-color: var(--deadlift); }
    .stat-card:nth-child(4) { border-top-color: var(--accent); }
    .stat-card .stat-value {
      font-size: 22px; font-weight: 700;
      color: var(--navy); margin-bottom: 2px;
    }
    .stat-card .stat-label {
      font-size: 10px; color: var(--muted);
      font-weight: 500; letter-spacing: 0.3px;
    }

    /* ── 圖表容器 ── */
    .chart-container {
      background: var(--surface);
      border-radius: 12px; padding: 14px;
      box-shadow: 0 1px 4px rgba(27,42,74,0.05);
      margin-bottom: 12px;
    }

    /* ── PR Badge ── */
    .pr-badge {
      display: inline-block;
      background: var(--accent); color: #fff;
      border-radius: 20px; padding: 2px 10px;
      font-size: 10px; font-weight: 700;
      margin-left: 6px; letter-spacing: 0.3px;
    }

    /* ── PR 歷史 ── */
    .pr-history-item {
      background: var(--surface);
      border-left: 3px solid #F9A825;
      padding: 10px 14px; border-radius: 0 8px 8px 0;
      margin-bottom: 8px; font-size: 13px;
      box-shadow: 0 1px 3px rgba(27,42,74,0.04);
    }
    .pr-history-item strong { color: var(--navy); }

    /* ── 體重區塊 ── */
    .bodyweight-section {
      background: linear-gradient(135deg, #E0F2F1 0%, #B2DFDB 100%);
      border-radius: 10px; padding: 14px;
      margin-bottom: 12px;
    }

    /* ── 慶祝動畫 ── */
    .celebration {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background: radial-gradient(ellipse at center, rgba(27,42,74,0.85) 0%, rgba(11,18,32,0.95) 100%);
      z-index: 10000; display: flex;
      align-items: center; justify-content: center;
      animation: celebFadeIn 0.3s ease;
    }
    @keyframes celebFadeIn {
      from { opacity: 0; } to { opacity: 1; }
    }
    .celebration-content {
      background: var(--surface);
      border-radius: 20px; padding: 36px 28px;
      text-align: center; max-width: 300px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      animation: celebPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes celebPop {
      from { transform: scale(0.5) translateY(20px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }

    /* ── 表單通用 ── */
    input[type="date"],
    input[type="number"],
    input[type="password"],
    input[type="text"] {
      border: 2px solid var(--border);
      border-radius: 8px; padding: 10px 12px;
      font-size: 14px; font-family: 'Noto Sans TC', sans-serif;
      background: var(--surface);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      color: var(--navy);
    }
    input:focus {
      outline: none;
      border-color: var(--navy);
      box-shadow: 0 0 0 3px rgba(27,42,74,0.08);
    }

    /* ── 按鈕通用 ── */
    .btn {
      border-radius: 8px; font-weight: 600;
      font-family: 'Noto Sans TC', sans-serif;
      transition: transform 0.1s ease, box-shadow 0.15s ease;
    }
    .btn:active { transform: scale(0.97); }

    .btn-navy {
      background: var(--navy); color: #fff; border: none;
    }
    .btn-navy:hover, .btn-navy:focus {
      background: var(--navy-light); color: #fff;
    }

    .btn-accent {
      background: var(--accent); color: #fff; border: none;
    }
    .btn-accent:hover, .btn-accent:focus {
      background: var(--accent-lt); color: #fff;
    }

    .btn-teal {
      background: var(--teal); color: #fff; border: none;
    }
    .btn-teal:hover, .btn-teal:focus {
      background: var(--teal-lt); color: #fff;
    }

    /* ── 設定頁 ── */
    .setting-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 14px;
      margin-bottom: 8px;
    }
    .setting-item-header {
      font-weight: 700; font-size: 14px;
      color: var(--navy); margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 2px solid var(--bg);
    }
    .setting-item-header.squat-color  { border-bottom-color: var(--squats); }
    .setting-item-header.press-color  { border-bottom-color: var(--press); }
    .setting-item-header.deadlift-color { border-bottom-color: var(--deadlift); }
    .setting-item-header.bench-color  { border-bottom-color: var(--bench); }

    /* ── 密碼修改區塊 ── */
    .pwd-section {
      background: var(--surface);
      border: 1px solid #FFCDD2;
      border-left: 3px solid var(--accent);
      border-radius: 10px; padding: 16px;
      margin-top: 16px;
    }
    .pwd-section h6 { color: var(--accent); font-weight: 700; }

    /* ── 生成頁 ── */
    .gen-option {
      background: var(--bg);
      padding: 12px 14px; border-radius: 10px;
      margin-bottom: 10px;
    }
    .gen-option label {
      font-weight: 700; font-size: 13px;
      color: var(--navy); display: block;
      margin-bottom: 6px;
    }

    /* ── 移動課表 ── */
    .move-date-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px; padding: 14px;
      margin-top: 12px;
    }

    /* ── 自訂 Modal ── */
    .modal-content {
      border-radius: 16px; border: none;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .modal-body {
      padding: 24px; font-size: 14px;
      color: var(--navy);
    }
    .modal-footer { border-top: 1px solid var(--border); }

    /* ── 標題樣式 ── */
    .section-title {
      font-weight: 700; font-size: 15px;
      color: var(--navy); margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--border);
    }

    /* ── 日期選擇器 ── */
    #targetDate {
      border: 2px solid var(--border);
      border-radius: 10px; padding: 12px 14px;
      font-size: 15px; font-weight: 500;
      background: var(--surface);
      margin-bottom: 14px;
    }

    /* ── 月曆控制按鈕 ── */
    .cal-nav-btn {
      background: var(--navy); color: #fff;
      border: none; border-radius: 8px;
      width: 32px; height: 32px;
      display: flex; align-items: center;
      justify-content: center; font-size: 16px;
      font-weight: 700;
      transition: background 0.2s ease;
    }
    .cal-nav-btn:hover { background: var(--navy-light); }

    /* ── 產生課表按鈕 ── */
    .gen-btn {
      background: var(--navy); color: #fff;
      border: none; border-radius: 12px;
      padding: 16px; font-size: 16px;
      font-weight: 700; font-family: 'Noto Sans TC', sans-serif;
      letter-spacing: 1px;
      transition: background 0.2s ease, transform 0.1s ease;
      width: 100%; margin-top: 8px;
    }
    .gen-btn:active {
      transform: scale(0.98);
      background: var(--navy-light);
    }

    /* ── 儲存設定按鈕 ── */
    .save-btn {
      background: var(--teal); color: #fff;
      border: none; border-radius: 10px;
      padding: 14px; font-size: 15px;
      font-weight: 700; font-family: 'Noto Sans TC', sans-serif;
      letter-spacing: 1px;
      transition: background 0.2s ease, transform 0.1s ease;
      width: 100%; margin-top: 12px;
    }
    .save-btn:active {
      transform: scale(0.98);
      background: var(--teal-lt);
    }

    /* ── 空狀態 ── */
    .empty-state {
      text-align: center; padding: 40px 20px;
      color: var(--muted); font-size: 13px;
    }

    /* ── 表單標籤 ── */
    .form-label-sm {
      font-size: 10px; color: var(--muted);
      font-weight: 500; text-transform: uppercase;
      letter-spacing: 0.5px; margin-bottom: 4px;
    }

    /* ── 自訂表單單選/核取 ── */
    .form-check-input:checked {
      background-color: var(--navy);
      border-color: var(--navy);
    }
    .form-check-input:focus {
      box-shadow: 0 0 0 3px rgba(27,42,74,0.15);
      border-color: var(--navy);
    }

    /* ── 文字工具 ── */
    .text-navy { color: var(--navy) !important; }
    .text-muted-custom { color: var(--muted) !important; }
    .text-accent { color: var(--accent) !important; }

    /* ── 漸層背景 ── */

    }

    /* ── 響應式 ── */
    /* 手機版：輸入框垂直堆疊，按鈕全寬 */
    @media (max-width: 480px) {
      .workout-inputs {

      .workout-input-group { flex: none !important; width: 100%; }
      .workout-input-group input { padding: 14px 8px; font-size: 20px; }

    }
  </style>

<body>

      <div class="pwd-section">

          <div class="col-3"><div class="stat-card"><div class="stat-value mono" id="statPRs">0</div><div class="stat-label">PR 總數</div></div></div>

      <!-- 體重紀錄 -->
      <div class="card">
        <div style="padding: 16px;">
          <h6 class="section-title text-teal">體重紀錄</h6>
          <div class="bodyweight-section">

              <div class="col-6">

      <span class="nav-icon">📅</span>課表
    </a>
    <a href="javascript:void(0)" class="nav-item" onclick="showTab('gen', this)">
      <span class="nav-icon">🚀</span>排程
    </a>
    <a href="javascript:void(0)" class="nav-item" onclick="showTab('set', this)">
      <span class="nav-icon">⚙️</span>設定

<!-- ═══════ Modal ═══════ -->
<div class="modal fade" id="customModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" style="margin: 20px;">
    <div class="modal-content">
      <div class="modal-body" id="customModalBody" style="white-space: pre-line;"></div>
      <div class="modal-footer" id="customModalFooter"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  let currentCalDate = new Date();
  let allEvents = {};
  const movements = [
    {id: 'Squat', name: '深蹲 Squat'}, {id: 'OverheadPress', name: '肩推 Press'},
    {id: 'Deadlift', name: '硬舉 Deadlift'}, {id: 'BenchPress', name: '臥推 Bench'}
  ];

  let sessionPwd = '';

  // ═══════ API — deep module ═══════
  // Interface: post(action, data) → result.data
  // Implementation hides: URL, auth injection, 8s timeout, 1-retry on network/5xx, error classification

  class AuthError extends Error { constructor(msg) { super(msg); this.name = 'AuthError'; } }
  class ValidationError extends Error { constructor(msg) { super(msg); this.name = 'ValidationError'; } }
  class NetworkError extends Error { constructor(msg) { super(msg); this.name = 'NetworkError'; } }

  const API = {
    _url: 'https://script.google.com/macros/s/AKfycbwOrHQPT_x5EtWMGVRx2fW0Qs1CZlTU4yB-vbyqYDTX0lOqK8Vp3sd6H74rqu_Kui414w/exec',
    _timeout: 8000,
    _maxRetries: 1,

    _classify: function(result) {
      if (result.error && result.error.toLowerCase().includes('密碼')) throw new AuthError(result.error);
      if (result.error && result.error.toLowerCase().includes('未知')) throw new ValidationError(result.error);
      throw new Error(result.error);
    },

    _request: async function(action, data) {
      const payload = { action: action, password: sessionPwd, ...data };
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), this._timeout);

      try {
        const res = await fetch(this._url, {
          method: 'POST',
          body: JSON.stringify(payload),
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          signal: controller.signal
        });
        clearTimeout(timer);

        // Handle HTTP errors
        if (!res.ok) {
          if (res.status >= 500) throw new NetworkError('Server error: ' + res.status);
          throw new NetworkError('HTTP ' + res.status);
        }

        const result = await res.json();
        if (!result.success) this._classify(result);
        return result.data;
      } catch (err) {
        clearTimeout(timer);
        // Retry on network errors and timeout
        if (err instanceof NetworkError || err.name === 'AbortError') {
          throw err; // will be retried by caller
        }
        throw err; // auth/validation errors — don't retry
      }
    },

    post: async function(action, data) {
      let lastErr;
      for (let attempt = 0; attempt <= this._maxRetries; attempt++) {
        try {
          return await this._request(action, data);
        } catch (err) {
          lastErr = err;
          if (err.name === 'AuthError' || err.name === 'ValidationError') throw err;
          if (attempt < this._maxRetries) continue; // retry
        }
      }
      throw lastErr;
    }
  };

  // ═══════ UI 共用 ═══════
  let appModal;
  window.addEventListener('DOMContentLoaded', () => {
    appModal = new bootstrap.Modal(document.getElementById('customModal'));
    renderSettingsUI();
    document.getElementById('targetDate').value = getLocalDateString();
    document.getElementById('startDate').value = getLocalDateString();
  });

  function showAlert(msg) {
    document.getElementById('customModalBody').innerHTML = msg;
    document.getElementById('customModalFooter').innerHTML = '<button type="button" class="btn btn-navy w-100" data-bs-dismiss="modal">確定</button>';
    appModal.show();
  }

  function showConfirm(msg, confirmCallback, btnText = '確定') {
    document.getElementById('customModalBody').innerHTML = msg;
    document.getElementById('customModalFooter').innerHTML = `
      <button type="button" class="btn btn-light border w-100 mb-2" data-bs-dismiss="modal">取消</button>
      <button type="button" class="btn btn-navy w-100 m-0" id="modalConfirmBtn">${btnText}</button>`;
    document.getElementById('modalConfirmBtn').onclick = function() { appModal.hide(); confirmCallback(); };
    appModal.show();
  }

  function showLoader(text = '處理中...') { document.getElementById('loaderText').innerText = text; document.getElementById('loader').style.display = 'flex'; }
  function hideLoader() { document.getElementById('loader').style.display = 'none'; }

  function showTab(id, el) {
    ['log','cal','gen','set','stat'].forEach(t => {
      const tab = document.getElementById('tab-'+t);
      if (tab) tab.style.display = (t === id) ? 'block' : 'none';
    });
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    el.classList.add('active');
    if(id === 'cal') renderCalendar();
    if(id === 'stat') renderStatistics();
  }

  // ═══════ 設定 UI ═══════
  function renderSettingsUI() {
    const colorMap = { 'Squat': 'squat-color', 'OverheadPress': 'press-color', 'Deadlift': 'deadlift-color', 'BenchPress': 'bench-color' };
    let html = '';
    movements.forEach(m => {
      html += `
      <div class="setting-item">
        <div class="setting-item-header ${colorMap[m.id]}">${m.name}</div>
        <div class="row g-2">
          <div class="col-6">
            <label class="form-label-sm">基礎 1RM</label>
            <input type="number" class="w-100 mono" id="${m.id}_1RM">
          </div>
          <div class="col-6">
            <label class="form-label-sm">累計增加</label>
            <input type="number" class="w-100 mono text-accent" id="${m.id}_Added">
          </div>
        </div>
      </div>`;
    });
    document.getElementById('settingsContainer').innerHTML = html;
  }

  // ═══════ 登入 ═══════
  async function doLogin() {
    const pwdInput = document.getElementById('loginPwd').value;
    if(!pwdInput) return showAlert('請輸入密碼');

    showLoader('驗證並載入資料中 (約需 2~3 秒)...');
    sessionPwd = pwdInput;
    const targetDate = document.getElementById('targetDate').value || getLocalDateString();

    try {
      const initData = await API.post('initLoad', { targetDate: targetDate });

      document.getElementById('loginScreen').style.opacity = '0';
      document.getElementById('loginScreen').style.transition = 'opacity 0.3s ease';
      setTimeout(() => {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
      }, 300);

      movements.forEach(m => {
        document.getElementById(m.id + '_1RM').value = initData.settings[m.id + '_1RM'] || 0;
        document.getElementById(m.id + '_Added').value = initData.settings[m.id + '_Added'] || 0;
      });

      allEvents = initData.events;
      renderCalendar();
      renderWorkoutsData(initData.workouts, targetDate);

    } catch(err) {
      hideLoader();
      sessionPwd = '';
      showAlert(err.message);
    }
  }

  // ═══════ 動作紀錄渲染 ═══════
  function renderWorkoutsData(data, date, events) {
    const list = document.getElementById('workoutList');
    if (data.length === 0) {
      list.innerHTML = '<div class="empty-state">今天沒有預定的訓練</div>';
      hideLoader(); return;
    }

    let html = `<h6 class="section-title" style="margin-bottom:14px;">🏋️ ${data[0].week}</h6>`;

    data.forEach((item, i) => {
      // 暖身組
      if (item.warmupWeight && item.warmupReps === 'warmup') {
        html += `<div class="warmup-block"><div class="warmup-label">🔥 暖身組</div><div class="warmup-detail">${item.warmupWeight}</div></div>`;
      }

      html += `
        <div class="workout-card">
          <div class="workout-card-header">
            <span class="workout-move-name">${item.movement}</span>
            <span class="workout-set-badge">${item.set}</span>
          </div>
          <div class="workout-plan">
            原訂 <strong>${item.targetWeight}kg × ${item.targetReps}</strong> <span class="text-muted-custom" style="font-size:11px;">(${item.percent || '-'})</span>
          </div>
          <div class="workout-inputs">
            <div class="workout-input-group" style="flex:1.5;">
              <label>重量</label>
              <input type="number" id="aw-${i}" class="mono" value="${item.actualWeight}">
            </div>
            <div class="workout-input-group" style="flex:1;">
              <label>次數</label>
              <input type="number" id="ar-${i}" class="mono" value="${item.actualReps.replace('+','')}">
            </div>
            <div class="workout-input-group" style="flex:4.5;">
              <label>&nbsp;</label>
              <button id="btn-${i}" class="workout-btn ${item.isLogged === 'V' ? 'btn-done' : 'btn-navy'}" onclick="doLog(${i},'${item.rowIdx}','${item.date}','${item.movement}')">${item.isLogged === 'V' ? '✅ 已儲存' : 'OK'}</button>
            </div>
          </div>
          ${item.isLogged === 'V' ? `<div class="est-1rm-display">📐 估算 1RM: <span class="mono"><strong>${Math.round(Math.min(Number(item.actualWeight) * (1 + Number(item.actualReps.replace('+','')) / 30), Number(item.actualWeight) * 1.25))}</strong> kg</span></div>` : ''}
        </div>`;
    });

    // 移動課表
    html += `
      <div class="move-date-box">
        <strong class="d-block mb-2" style="font-size:13px; color: var(--navy);">📅 將本日課表移動至其他日期</strong>
        <div class="d-flex gap-2">
          <input type="date" id="newMoveDate" class="flex-grow-1" value="${date}" style="margin:0;">
          <button class="btn btn-navy py-2 px-3" onclick="moveSchedule('${date}')">移動</button>
        </div>
      </div>`;

    list.innerHTML = html;
    hideLoader();
  }

  let loadWorkoutsTimer = null;
  function loadWorkouts() {
    showLoader('讀取課表中...');
    clearTimeout(loadWorkoutsTimer);
    loadWorkoutsTimer = setTimeout(async () => {
      const date = document.getElementById('targetDate').value;
      try {
        const data = await API.post('getProgramByDate', { targetDate: date });
        renderWorkoutsData(data, date);
      } catch(err) { hideLoader(); showAlert(err.message); }
    }, 300);
  }

  async function executeMove(oldDate, newDate) {
    showLoader('移動並合併課表中...');
    try {
      const msg = await API.post('moveWorkoutDate', { oldDate, newDateStr: newDate });
      showAlert("✅ " + msg);
      document.getElementById('targetDate').value = newDate;
      allEvents = await API.post('getAllPrograms');
      renderCalendar();
      loadWorkouts();
    } catch(err) { hideLoader(); showAlert('移動失敗：' + err.message); }
  }

  function moveSchedule(oldDate) {
    const newDate = document.getElementById('newMoveDate').value;
    if (!newDate || oldDate === newDate) return showAlert('請選擇一個不同的日期！');
    if (allEvents[newDate]) {
      showConfirm(`⚠️ 目標日期已有課表，確定要合併嗎？`, () => executeMove(oldDate, newDate), '確定合併');
    } else {
      executeMove(oldDate, newDate);
    }
  }

  async function executeGenerate(sd, inc, tmRatio, progType) {
    showLoader('正在生成課表與附加紀錄...');
    try {
      const msg = await API.post('generateProgram', { startDateStr: sd, isIncrement: inc, tmRatio, progType });
      showAlert(msg);
      showLoader('刷新系統資料...');
      const s = await API.post('getSettings');
      movements.forEach(move => {
        document.getElementById(move.id + '_1RM').value = s[move.id + '_1RM'] || 0;
        document.getElementById(move.id + '_Added').value = s[move.id + '_Added'] || 0;
      });
      allEvents = await API.post('getAllPrograms');
      renderCalendar();
      await loadWorkouts();
      showTab('log', document.querySelector('.bottom-nav .nav-item'));
      hideLoader();
    } catch(err) { hideLoader(); showAlert('產生失敗：' + err.message); }
  }

  function generate() {
    const sd = document.getElementById('startDate').value;
    const inc = document.getElementById('incCheck').checked;
    const tmRatio = document.querySelector('input[name="tmRatio"]:checked').value;
    const progType = document.querySelector('input[name="progType"]:checked').value;

    let baseDate = new Date(sd);
    let diff = baseDate.getDate() - baseDate.getDay() + (baseDate.getDay() == 0 ? -6 : 1);
    let startMonday = new Date(baseDate.setDate(diff));

    let hasOverlap = false;
    for (let i = 0; i < 28; i++) {
      let checkDate = new Date(startMonday);
      checkDate.setDate(startMonday.getDate() + i);
      let checkDateStr = getLocalDateString(checkDate);
      if (allEvents[checkDateStr]) { hasOverlap = true; break; }
    }

    if (hasOverlap) {
      showConfirm("⚠️ <strong class='text-accent'>發現衝突！</strong>\n\n選擇的區間內已有舊課表。\n繼續執行將會覆蓋衝突的部分。", () => executeGenerate(sd, inc, tmRatio, progType), '確定覆蓋');
    } else {
      executeGenerate(sd, inc, tmRatio, progType);
    }
  }

  async function doLog(i, row, d, m) {
    const awEl = document.getElementById('aw-'+i), arEl = document.getElementById('ar-'+i), btn = document.getElementById('btn-'+i);
    const card = btn.closest('.workout-card');
    const aw = awEl.value, ar = arEl.value;

    // ── 樂觀更新：立即顯示「已儲存」 ──
    const prevClassName = btn.className;
    const prevText = btn.innerText;
    const prevDone = allEvents[d] ? { ...allEvents[d] } : null;

    btn.className = 'workout-btn btn-done btn-syncing';
    btn.innerText = '✅ 儲存中...';
    btn.disabled = true;

    if (allEvents[d]) {
      allEvents[d].doneCount += 1;
      allEvents[d].done = (allEvents[d].doneCount >= allEvents[d].sets);
    }
    renderCalendar();

    // ── 背景寫入 API ──
    let result;
    try {
      result = await API.post('logWorkout', { logData: { rowIdx: row, date: d, movement: m, actualWeight: aw, actualReps: ar } });
    } catch(err) {
      // ── 寫入失敗：回滾 ──
      btn.className = prevClassName;
      btn.innerText = prevText;
      btn.disabled = false;
      if (prevDone) {
        allEvents[d] = prevDone;
        renderCalendar();
      }
      showAlert('紀錄失敗：' + err.message);
      return;
    }

    // ── 寫入成功：移除動畫，顯示最終狀態 ──
    btn.className = 'workout-btn btn-done';
    btn.innerText = '✅ 已儲存';
    btn.disabled = false;

    if (result.est1RM && result.est1RM > 0) {
      const est1RMEl = card.querySelector('.est-1rm-display');
      if (est1RMEl) {
        est1RMEl.innerHTML = `📐 估算 1RM: <span class="mono"><strong>${Math.round(result.est1RM)}</strong> kg</span>`;
      } else {
        card.insertAdjacentHTML('beforeend', `<div class="est-1rm-display">📐 估算 1RM: <span class="mono"><strong>${Math.round(result.est1RM)}</strong> kg</span></div>`);
      }
    }

    if (result.pr && result.pr.length > 0) {
      showPRCelebration(result.pr);
    }
  }

  async function saveSet() {
    let d = {};
    movements.forEach(m => {
      d[m.id + '_1RM'] = document.getElementById(m.id + '_1RM').value;
      d[m.id + '_Added'] = document.getElementById(m.id + '_Added').value;
    });
    showLoader('儲存設定中...');
    try {
      const msg = await API.post('saveSettings', { data: d });
      hideLoader(); showAlert(msg);
    } catch(err) { hideLoader(); showAlert('儲存失敗：' + err.message); }
  }

  // ═══════ 日曆 ═══════
  function renderCalendar() {
    const container = document.getElementById('calendarContainer');
    const display = document.getElementById('calMonthDisplay');
    container.innerHTML = '';
    ['日','一','二','三','四','五','六'].forEach(d => container.innerHTML += `<div class="cal-header">${d}</div>`);

    const year = currentCalDate.getFullYear(), month = currentCalDate.getMonth();
    display.innerText = `${year}/${month + 1}`;
    const firstDay = new Date(year, month, 1).getDay(), daysInMonth = new Date(year, month + 1, 0).getDate();
    const today = new Date();
    const todayStr = getLocalDateString(today);

    for(let i=0; i<firstDay; i++) container.innerHTML += `<div class="cal-day bg-light"></div>`;
    for(let d=1; d<=daysInMonth; d++) {
      let fullDate = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      let event = allEvents[fullDate];
      let isToday = fullDate === todayStr ? ' cal-today' : '';
      let moveClass = '';
      if (event) {
        const mv = event.move || '';
        if (mv.includes('深蹲') || mv.includes('Squat')) moveClass = '';
        else if (mv.includes('硬舉') || mv.includes('Deadlift')) moveClass = 'move-deadlift';
        else if (mv.includes('肩推') || mv.includes('Press')) moveClass = 'move-press';
        else if (mv.includes('臥推') || mv.includes('Bench')) moveClass = 'move-bench';
      }
      container.innerHTML += `
        <div class="cal-day${isToday}" onclick="goToDate('${fullDate}')">
          <strong class="cal-day-num">${d}</strong>
          ${event ? `<span class="cal-week-tag">${event.week}</span><div class="cal-event ${moveClass} ${event.done?'cal-done':''}"><b>${event.move.split(' ')[0]}</b><br>${event.maxWeight}kg × ${event.sets}組</div>` : ''}
        </div>`;
    }
  }
  function changeMonth(dir) {
    currentCalDate.setDate(1); // 避免 5/31 → setMonth(5) 溢出到 7/1
    currentCalDate.setMonth(currentCalDate.getMonth() + dir);
    renderCalendar();
  }
  function goToDate(date) { document.getElementById('targetDate').value = date; showTab('log', document.querySelector('.nav-item')); loadWorkouts(); }

  // ═══════ PR 慶祝 ═══════
  function showPRCelebration(prTypes) {
    const overlay = document.createElement('div');
    overlay.className = 'celebration';
    overlay.innerHTML = `
      <div class="celebration-content">
        <div style="font-size: 52px;">🎉</div>
        <h4 class="mt-3 mb-2 text-accent fw-bold">恭喜創 PR！</h4>
        <p class="text-muted-custom">${prTypes.join(' / ')} PR</p>
        <button class="btn btn-accent w-100 mt-3 py-2" onclick="this.closest('.celebration').remove()">太棒了！</button>
      </div>`;
    document.body.appendChild(overlay);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
  }

  // ═══════ 統計 ═══════
  let chartInstances = {};

  async function renderStatistics() {
    const statCharts = document.getElementById('statCharts');
    const statEmpty = document.getElementById('statEmpty');
    const prList = document.getElementById('prHistoryList');

    showLoader('載入統計資料中...');

    try {
      const stats = await API.post('getStatistics');
      const prs = await API.post('getPRs');
      const bodyweights = await API.post('getBodyWeight');

      document.getElementById('bodyweightDate').value = getLocalDateString();

      if (stats.summary.totalSessions === 0) {
        hideLoader();
        statCharts.style.display = 'none';
        statEmpty.style.display = 'block';
        prList.innerHTML = '<p class="text-muted-custom small text-center py-2">尚無 PR 紀錄</p>';
        chartInstances.bodyweight = null;
        return;
      }

      statCharts.style.display = 'block';
      statEmpty.style.display = 'none';

      document.getElementById('statSessions').textContent = stats.summary.totalSessions;
      document.getElementById('statVolume').textContent = formatVolume(stats.summary.totalVolume);
      document.getElementById('statRecent').textContent = stats.summary.recentDays;
      document.getElementById('statPRs').textContent = prs.length;

      if (Object.keys(stats.volumeTrends).length > 0) {
        ChartService.renderTrendChart('volumeChart', stats.volumeTrends, '各動作訓練量趨勢', true);
      }
      if (Object.keys(stats.weightTrends).length > 0) {
        ChartService.renderTrendChart('weightTrendChart', stats.weightTrends, '各動作最大重量趨勢', false);
      }
      if (bodyweights.length > 0) {
        ChartService.renderBodyweight('bodyweightChart', bodyweights);
      } else {
        if (chartInstances.bodyweight) { chartInstances.bodyweight.destroy(); chartInstances.bodyweight = null; }
      }

      const prByMove = {};
      prs.forEach(pr => {
        if (!prByMove[pr.movement] || pr.weight > prByMove[pr.movement].weight) {
          prByMove[pr.movement] = pr;
        }
      });
      const bestPRs = Object.values(prByMove).sort((a, b) => b.weight - a.weight);
      if (bestPRs.length > 0) {
        prList.innerHTML = bestPRs.map(pr => `
          <div class="pr-history-item">
            <strong>${pr.movement}</strong> <span class="mono">${pr.weight}</span>kg × ${pr.reps}
            <span class="pr-badge">${pr.type}</span>
            <div class="text-muted-custom" style="font-size:10px;">${pr.date}</div>
          </div>`).join('');
      } else {
        prList.innerHTML = '<p class="text-muted-custom small text-center py-2">尚無 PR 紀錄</p>';
      }

      hideLoader();

    } catch(err) {
      hideLoader();
      console.error('統計載入失敗:', err);
      statEmpty.style.display = 'block';
      statEmpty.innerHTML = `<p class="mb-0 text-accent">載入失敗：${err.message}</p>`;
    }
  }

  // ═══════ ChartService — deep module ═══════
  // Interface: renderTrendChart(canvasId, data, title, beginAtZero), renderBodyweight(canvasId, data)
  // Implementation hides: Chart.js config template, instance lifecycle, color mapping

  const ChartService = {
    _colors: { '深蹲 Squat': '#1565C0', '肩推 Press': '#2E7D32', '硬舉 Deadlift': '#E65100', '臥推 Bench': '#AD1457' },
    _movementOrder: ['深蹲 Squat', '肩推 Press', '硬舉 Deadlift', '臥推 Bench'],
    _chartOptions: {
      responsive: true,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        title: { display: true, font: { size: 13, weight: '700', family: "'Noto Sans TC', sans-serif" } },
        legend: { labels: { usePointStyle: true, padding: 16, font: { size: 11, family: "'Noto Sans TC', sans-serif" } } },
        tooltip: {
          backgroundColor: 'rgba(27,42,74,0.9)',
          titleFont: { family: "'IBM Plex Mono', monospace" },
          bodyFont: { family: "'IBM Plex Mono', monospace" },
          cornerRadius: 8, padding: 10
        }
      },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 10, family: "'IBM Plex Mono', monospace" }, color: '#6B7B8D', maxRotation: 45 }, border: { display: false } },
        y: { grid: { color: 'rgba(27,42,74,0.06)' }, ticks: { font: { size: 10, family: "'IBM Plex Mono', monospace" }, color: '#6B7B8D' }, border: { display: false } }
      }
    },

    _buildDatasets: function(trends) {
      const datasets = [];
      const allDates = new Set();
      this._movementOrder.forEach(move => {
        if (trends[move]) Object.keys(trends[move]).forEach(d => allDates.add(d));
      });
      const sortedDates = [...allDates].sort();

      this._movementOrder.forEach(move => {
        if (trends[move] && Object.keys(trends[move]).length > 0) {
          datasets.push({
            label: move,
            data: sortedDates.map(d => ({ x: d, y: trends[move][d] || null })),
            borderColor: this._colors[move], backgroundColor: this._colors[move],
            pointRadius: 4, pointHoverRadius: 6,
            borderWidth: 2.5, tension: 0.3, spanGaps: true
          });
        }
      });
      return { datasets, sortedDates };
    },

    renderTrendChart: function(canvasId, trends, title, beginAtZero) {
      const ctx = document.getElementById(canvasId).getContext('2d');
      if (chartInstances[canvasId]) chartInstances[canvasId].destroy();

      const { datasets, sortedDates } = this._buildDatasets(trends);
      chartInstances[canvasId] = new Chart(ctx, {
        type: 'line',
        data: { datasets: datasets },
        options: Object.assign({}, this._chartOptions, {
          plugins: Object.assign({}, this._chartOptions.plugins, { title: { display: true, text: title, font: { size: 13, weight: '700', family: "'Noto Sans TC', sans-serif" } } }),
          scales: Object.assign({}, this._chartOptions.scales, {
            x: Object.assign({}, this._chartOptions.scales.x, { type: 'category', labels: sortedDates }),
            y: Object.assign({}, this._chartOptions.scales.y, { beginAtZero: beginAtZero })
          })
        })
      });
    },

    renderBodyweight: function(canvasId, bodyweights) {
      const ctx = document.getElementById(canvasId).getContext('2d');
      if (chartInstances[canvasId]) chartInstances[canvasId].destroy();

      const sorted = bodyweights.slice().reverse();
      chartInstances[canvasId] = new Chart(ctx, {
        type: 'line',
        data: {
          labels: sorted.map(d => d.date.slice(5)),
          datasets: [{
            label: '體重 (kg)', data: sorted.map(d => d.weight),
            borderColor: '#00796B', backgroundColor: 'rgba(0,121,107,0.08)',
            fill: true, tension: 0.3,
            pointRadius: 4, pointHoverRadius: 6, borderWidth: 2.5
          }]
        },
        options: Object.assign({}, this._chartOptions, {
          plugins: Object.assign({}, this._chartOptions.plugins, {
            title: { display: true, text: '體重趨勢', font: { size: 13, weight: '700', family: "'Noto Sans TC', sans-serif" } },
            legend: { display: false }
          }),
          scales: {
            x: { grid: { display: false }, ticks: { font: { size: 10, family: "'IBM Plex Mono', monospace" }, color: '#6B7B8D' }, border: { display: false } },
            y: { grid: { color: 'rgba(27,42,74,0.06)' }, ticks: { font: { size: 10, family: "'IBM Plex Mono', monospace" }, color: '#6B7B8D' }, border: { display: false } }
          }
        })
      });
    }
  };

  // ═══════ 體重紀錄 ═══════
  async function saveBodyWeight() {
    const date = document.getElementById('bodyweightDate').value;
    const weight = document.getElementById('bodyweightValue').value;
    if (!date || !weight) return showAlert('請輸入日期與體重');

    showLoader('儲存體重中...');
    try {
      const msg = await API.post('saveBodyWeight', { bodyData: { date, weight: Number(weight) } });
      hideLoader();
      showAlert(msg);
      renderStatistics();
    } catch(err) {
      hideLoader();
      showAlert('儲存失敗：' + err.message);
    }
  }

  // ═══════ 密碼修改 ═══════
  async function changePassword() {
    const oldPwd = document.getElementById('oldPwd').value;
    const newPwd = document.getElementById('newPwd').value;
    const confirmPwd = document.getElementById('confirmPwd').value;

    if (!oldPwd || !newPwd || !confirmPwd) return showAlert('請填寫所有欄位');
    if (newPwd !== confirmPwd) return showAlert('兩次輸入的新密碼不一致');
    if (newPwd.length < 4) return showAlert('密碼至少需要 4 個字元');

    showLoader('更新密碼中...');
    try {
      const msg = await API.post('changePassword', { oldPassword: oldPwd, newPassword: newPwd });
      hideLoader();
      showAlert(msg);
      document.getElementById('oldPwd').value = '';
      document.getElementById('newPwd').value = '';
      document.getElementById('confirmPwd').value = '';
    } catch(err) {
      hideLoader();
      showAlert('密碼更新失敗：' + err.message);
    }
  }

  // ═══════ 輔助 ═══════
  function formatVolume(vol) {
    if (vol >= 1000) return (vol / 1000).toFixed(1) + 'K';
    return vol.toString();
  }

  // 本地日期字串 (yyyy-MM-dd)，避免 toISOString() 回傳 UTC 日期
  // 不傳參數 → 當天，傳 Date 物件 → 該日期
  function getLocalDateString(d) {
    const date = d || new Date();
    return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
  }

  // ═══════ PWA Service Worker ═══════
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js?v=21', { scope: './' })
        .then((reg) => { console.log('SW registered:', reg.scope); })
        .catch((err) => { console.log('SW registration failed:', err); });
    });
  }

  // ═══════ PWA 安裝提示 ═══════
  let deferredPrompt = null;

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    setTimeout(() => {
      if (!document.querySelector('#installBanner')) {
        const banner = document.createElement('div');
        banner.id = 'installBanner';
        banner.style.cssText = 'position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--navy);color:white;padding:12px 20px;border-radius:12px;z-index:9998;box-shadow:0 4px 20px rgba(27,42,74,0.3);font-size:13px;display:flex;align-items:center;gap:10px;max-width:90%;font-family:"Noto Sans TC",sans-serif;';
        banner.innerHTML = `
          <span>📲 新增至主畫面，快速開啟課表</span>
          <button id="installBtn" class="btn btn-sm" style="background:#fff;color:var(--navy);font-weight:700;border:none;padding:4px 14px;border-radius:8px;">安裝</button>
          <button id="installClose" style="background:none;border:none;color:#fff;font-size:18px;padding:4px 8px;">✕</button>`;
        document.body.appendChild(banner);

        document.getElementById('installBtn').addEventListener('click', async () => {
          banner.remove();
          if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            deferredPrompt = null;
            console.log('Install outcome:', outcome);
          }
        });

        document.getElementById('installClose').addEventListener('click', () => {
          banner.remove();
        });
      }
    }, 5000);
  });
</script>
</body>
