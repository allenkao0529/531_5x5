<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>531 課表管理系統</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <!-- 給 Apple iOS (iPhone/iPad) 辨識的 App Icon -->
  <link rel="apple-touch-icon" href="icon-180.png">

  <!-- 給一般瀏覽器與 Android 辨識的網頁 Icon (Favicon) -->
  <link rel="icon" type="image/png" href="icon-512.png">
  <style>
    :root { --primary-color: #0d6efd; }
    body { background-color: #f4f7f6; padding: 10px 10px 80px 10px; font-family: 'Microsoft JhengHei', -apple-system, sans-serif; font-size: 16px; }
    .content-wrapper { max-width: 600px; margin: 0 auto; }
    .my-tab { display: block; }
    .card { border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 15px; }
    .bottom-nav { position: fixed; bottom: 0; width: 100%; background: white; border-top: 1px solid #eee; display: flex; justify-content: space-around; padding: 10px 0; z-index: 1000; }
    .nav-item { text-align: center; color: #888; text-decoration: none; font-size: 12px; flex: 1; }
    .nav-item.active { color: var(--primary-color); font-weight: bold; }

    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; background: #eee; border: 1px solid #eee; }
    #tab-cal { margin-left: 0; margin-right: 0; }
    #tab-cal .card { border-radius: 0; box-shadow: none; }
    .cal-day { background: white; min-height: 90px; padding: 4px; font-size: 11px; position: relative; }
    .cal-header { background: #f8f9fa; text-align: center; font-weight: bold; padding: 5px; font-size: 12px; }
    .cal-today { background: #fff4e5; }
    .cal-event { background: #e7f1ff; color: #0d6efd; border-radius: 4px; padding: 3px; margin-top: 3px; font-size: 8px; line-height: 1.2; border-left: 3px solid #0d6efd; }
    .cal-done { background: #e6ffed; color: #28a745; border-left-color: #28a745; text-decoration: line-through; }
    .cal-week-tag { font-size: 8px; color: #495057; display: block; margin-bottom: 1px; font-weight: bold; }

    /* 修正：把 loader 移到真正的最上層 */
    #loader { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); z-index: 9999; flex-direction: column; align-items: center; justify-content: center; }
    
    /* 修正：登入畫面層級維持 1000，讓預設的 Modal(1055) 能夠浮在它上面 */
    #loginScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f4f7f6; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    .login-box { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
    
    .warmup-block { background: #f0f0f0; border-left: 3px solid #adb5bd; padding: 8px 10px; border-radius: 6px; margin-bottom: 8px; font-size: 12px; }
    .warmup-block .warmup-label { color: #6c757d; font-weight: 600; font-size: 11px; }
    .warmup-block .warmup-detail { color: #495057; margin-top: 2px; }
    .est-1rm-display { background: #fff3cd; border-radius: 6px; padding: 6px 10px; margin-top: 8px; font-size: 12px; color: #856404; }
    .stat-card { background: white; border-radius: 10px; padding: 12px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .stat-card .stat-value { font-size: 24px; font-weight: 700; color: var(--primary-color); }
    .stat-card .stat-label { font-size: 11px; color: #6c757d; }
    .chart-container { background: white; border-radius: 10px; padding: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 12px; }
    .pr-badge { display: inline-block; background: #dc3545; color: white; border-radius: 12px; padding: 2px 8px; font-size: 10px; font-weight: 600; margin-left: 4px; }
    .pr-history-item { background: #fff8f0; border-left: 3px solid #ffc107; padding: 8px 10px; border-radius: 6px; margin-bottom: 6px; font-size: 12px; }
    .bodyweight-section { background: #e8f4f8; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
    .celebration { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 10000; display: flex; align-items: center; justify-content: center; }
    .celebration-content { background: white; border-radius: 16px; padding: 30px; text-align: center; max-width: 300px; animation: popIn 0.3s ease; }
    @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .option-group { background: #f8f9fa; padding: 10px; border-radius: 8px; margin-bottom: 15px;}
  </style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <h3 class="mb-4 text-primary fw-bold">531 課表管理系統</h3>
    <p class="text-muted mb-4 small">請輸入系統密碼以存取您的個人課表</p>
    <input type="text" id="loginPwd" style="-webkit-text-security: disc;" class="form-control form-control-lg mb-3" placeholder="請輸入密碼" onkeypress="if(event.key === 'Enter') doLogin()">
    <button class="btn btn-primary btn-lg w-100 fw-bold" onclick="doLogin()">登入系統</button>
  </div>
</div>

<div id="loader"><div class="spinner-border text-primary mb-2"></div><span id="loaderText" class="fw-bold text-secondary mt-2">處理中...</span></div>

<div id="mainApp" style="display: none;">
  <div class="content-wrapper">
    <div id="tab-log" class="my-tab active">
      <div class="card p-3">
        <input type="date" class="form-control mb-3" id="targetDate" onchange="loadWorkouts()">
        <div id="workoutList"></div>
      </div>
    </div>

    <div id="tab-cal" class="my-tab" style="display:none;">
      <div class="card p-2">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h6 id="calMonthDisplay" class="mb-0"></h6>
          <div>
            <button class="btn btn-sm btn-outline-secondary" onclick="changeMonth(-1)">‹</button>
            <button class="btn btn-sm btn-outline-secondary" onclick="changeMonth(1)">›</button>
          </div>
        </div>
        <div class="calendar-grid" id="calendarContainer"></div>
      </div>
    </div>

    <div id="tab-gen" class="my-tab" style="display:none;">
      <div class="card p-3 text-center">
        <h6 class="mb-3">生成新週期 (4週份)</h6>
        <div class="text-start bg-light p-2 rounded mb-3">
          <label class="fw-bold d-block text-primary">設定新週期起始日 (Week 1)</label>
          <input type="date" class="form-control mt-1" id="startDate">
        </div>
        <div class="text-start bg-light p-2 rounded mb-3">
          <label class="fw-bold d-block text-primary">課表類型選擇</label>
          <div class="d-flex gap-4 mt-1">
            <div class="form-check"><input class="form-check-input" type="radio" name="progType" id="prog531" value="531" checked><label class="form-check-label">標準 5/3/1</label></div>
            <div class="form-check"><input class="form-check-input" type="radio" name="progType" id="prog5x5" value="5x5"><label class="form-check-label">力量 5x5</label></div>
          </div>
        </div>
        <div class="text-start bg-light p-2 rounded mb-3">
          <label class="fw-bold d-block text-primary">TM 強度計算基底</label>
          <div class="d-flex gap-4 mt-1">
            <div class="form-check"><input class="form-check-input" type="radio" name="tmRatio" id="tmLoose" value="0.9" checked><label class="form-check-label">寬鬆版 (90%)</label></div>
            <div class="form-check"><input class="form-check-input" type="radio" name="tmRatio" id="tmStrict" value="0.95"><label class="form-check-label">嚴格版 (95%)</label></div>
          </div>
        </div>
        <div class="form-check mb-3 text-start">
          <input class="form-check-input" type="checkbox" id="incCheck">
          <label class="form-check-label fw-bold" style="color: #d63384;">🔥 下一週期自動累加重量 (上肢2.5kg/下肢5kg)</label>
        </div>
        <button class="btn btn-primary w-100 py-2 fw-bold" onclick="generate()">🚀 生成課表並接續存檔</button>
      </div>
    </div>

    <div id="tab-set" class="my-tab" style="display:none;">
      <div class="card p-3 bg-light">
        <h6 class="mb-3 text-secondary text-center">1RM 分離管理面板</h6>
        <div id="settingsContainer"></div>
        <button class="btn btn-success w-100 mt-3 py-2 fw-bold" onclick="saveSet()">💾 儲存設定</button>
      </div>
    </div>

    <div id="tab-stat" class="my-tab" style="display:none;">
      <!-- 統計圖表 -->
      <div id="statCharts" style="display:none;">
        <div class="row g-2 mb-3">
          <div class="col-3"><div class="stat-card"><div class="stat-value" id="statSessions">0</div><div class="stat-label">總訓練次數</div></div></div>
          <div class="col-3"><div class="stat-card"><div class="stat-value" id="statVolume">0</div><div class="stat-label">總訓練量(kg)</div></div></div>
          <div class="col-3"><div class="stat-card"><div class="stat-value" id="statRecent">0</div><div class="stat-label">近30天訓練天</div></div></div>
          <div class="col-3"><div class="stat-card"><div class="stat-value" id="statPRs">0</div><div class="stat-label">PR 總數</div></div></div>
        </div>
        <div class="chart-container"><canvas id="volumeChart" height="200"></canvas></div>
        <div class="chart-container"><canvas id="weightTrendChart" height="250"></canvas></div>
      </div>
      <div id="statEmpty" class="text-center py-5 text-muted">
        <p class="mb-0">尚無訓練紀錄，開始訓練後即可看到統計</p>
      </div>

      <!-- 體重紀錄 -->
      <div class="card p-3 mt-3">
        <h6 class="mb-3 text-info fw-bold">⚖️ 體重紀錄</h6>
        <div class="bodyweight-section">
          <div class="row g-2 align-items-end">
            <div class="col-5">
              <label class="text-muted small">日期</label>
              <input type="date" class="form-control form-control-sm" id="bodyweightDate">
            </div>
            <div class="col-4">
              <label class="text-muted small">體重 (kg)</label>
              <input type="number" step="0.1" class="form-control form-control-sm" id="bodyweightValue" placeholder="0.0">
            </div>
            <div class="col-3">
              <button class="btn btn-info btn-sm w-100 text-white fw-bold" onclick="saveBodyWeight()">儲存</button>
            </div>
          </div>
        </div>
        <div class="chart-container"><canvas id="bodyweightChart" height="180"></canvas></div>
      </div>

      <!-- PR 歷史 -->
      <div class="card p-3 mt-3">
        <h6 class="mb-3 text-warning fw-bold">🏆 PR 歷史紀錄</h6>
        <div id="prHistoryList"><p class="text-muted small text-center py-2">尚無 PR 紀錄</p></div>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <a href="javascript:void(0)" class="nav-item active" onclick="showTab('log', this)"><div>📝</div>紀錄</a>
    <a href="javascript:void(0)" class="nav-item" onclick="showTab('cal', this)"><div>📅</div>課表</a>
    <a href="javascript:void(0)" class="nav-item" onclick="showTab('gen', this)"><div>🚀</div>課表</a>
    <a href="javascript:void(0)" class="nav-item" onclick="showTab('set', this)"><div>⚙️</div>設定</a>
    <a href="javascript:void(0)" class="nav-item" onclick="showTab('stat', this)"><div>📊</div>統計</a>
  </div>
</div>

<div class="modal fade" id="customModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" style="margin: 20px;">
    <div class="modal-content" style="border-radius: 12px; border: none; box-shadow: 0 10px 20px rgba(0,0,0,0.2);">
      <div class="modal-body py-4" id="customModalBody" style="white-space: pre-line; font-size: 15px; color: #333;"></div>
      <div class="modal-footer border-0 pt-0 pb-3" id="customModalFooter"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  // ==========================================
  // 🔥 請在這裡貼上你後端 GAS 的網頁應用程式網址
  // ==========================================
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwOrHQPT_x5EtWMGVRx2fW0Qs1CZlTU4yB-vbyqYDTX0lOqK8Vp3sd6H74rqu_Kui414w/exec";

  let currentCalDate = new Date();
  let allEvents = {};
  const movements = [
    {id: 'Squat', name: '深蹲 Squat'}, {id: 'OverheadPress', name: '肩推 Press'}, 
    {id: 'Deadlift', name: '硬舉 Deadlift'}, {id: 'BenchPress', name: '臥推 Bench'}
  ];

  let sessionPwd = '';

  // ================= API 核心驅動模組 =================
  async function fetchAPI(action, data = {}) {
    const payload = { action: action, password: sessionPwd, ...data };
    try {
      const res = await fetch(GAS_API_URL, {
        method: 'POST',
        body: JSON.stringify(payload),
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
      });
      const result = await res.json();
      if (!result.success) throw new Error(result.error);
      return result.data;
    } catch (err) {
      throw err;
    }
  }

  // ================= 介面共用模組 =================
  let appModal;
  window.addEventListener('DOMContentLoaded', () => { appModal = new bootstrap.Modal(document.getElementById('customModal')); });

  function showAlert(msg) {
    document.getElementById('customModalBody').innerHTML = msg;
    document.getElementById('customModalFooter').innerHTML = '<button type="button" class="btn btn-primary w-100" data-bs-dismiss="modal">確定</button>';
    appModal.show();
  }

  function showConfirm(msg, confirmCallback, btnText = '確定') {
    document.getElementById('customModalBody').innerHTML = msg;
    document.getElementById('customModalFooter').innerHTML = `
      <button type="button" class="btn btn-light border w-100 mb-2" data-bs-dismiss="modal">取消</button>
      <button type="button" class="btn btn-primary w-100 m-0" id="modalConfirmBtn">${btnText}</button>`;
    document.getElementById('modalConfirmBtn').onclick = function() { appModal.hide(); confirmCallback(); };
    appModal.show();
  }

  function showLoader(text = '處理中...') { document.getElementById('loaderText').innerText = text; document.getElementById('loader').style.display = 'flex'; }
  function hideLoader() { document.getElementById('loader').style.display = 'none'; }

  function showTab(id, el) {
    ['log','cal','gen','set','stat'].forEach(t => {
      const tab = document.getElementById('tab-'+t);
      if (tab) tab.style.display = (t === id) ? 'block' : 'none';
    });
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    el.classList.add('active');
    if(id === 'cal') renderCalendar();
    if(id === 'stat') renderStatistics();
  }

  function renderSettingsUI() {
    let html = '';
    movements.forEach(m => {
      html += `
      <div class="bg-white border rounded p-2 mb-2">
        <div class="fw-bold text-primary mb-1 border-bottom">${m.name}</div>
        <div class="row g-2">
          <div class="col-6"><label class="text-muted small">基礎1RM</label><input type="number" class="form-control form-control-sm" id="${m.id}_1RM"></div>
          <div class="col-6"><label class="text-muted small">累計增加</label><input type="number" class="form-control form-control-sm text-danger fw-bold" id="${m.id}_Added"></div>
        </div>
      </div>`;
    });
    document.getElementById('settingsContainer').innerHTML = html;
  }

  // ================= 登入與加速初始化模組 =================
  window.onload = () => {
    renderSettingsUI();
    document.getElementById('targetDate').value = new Date().toISOString().split('T')[0];
    document.getElementById('startDate').value = new Date().toISOString().split('T')[0];
  };

  async function doLogin() {
    const pwdInput = document.getElementById('loginPwd').value;
    if(!pwdInput) return showAlert('請輸入密碼');
    
    // 顯示帶有明確提示的 Loader
    showLoader('驗證並載入資料中 (約需 2~3 秒)...');
    sessionPwd = pwdInput; 
    const targetDate = document.getElementById('targetDate').value;
    
    try {
      // 🚀 關鍵升級：透過三合一 API，一次把全部資料拿回來
      const initData = await fetchAPI('initLoad', { targetDate: targetDate });
      
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('mainApp').style.display = 'block';
      
      // 1. 填入設定資料
      movements.forEach(m => {
        document.getElementById(m.id + '_1RM').value = initData.settings[m.id + '_1RM'] || 0;
        document.getElementById(m.id + '_Added').value = initData.settings[m.id + '_Added'] || 0;
      });
      
      // 2. 繪製月曆
      allEvents = initData.events;
      renderCalendar();
      
      // 3. 繪製今日課表
      renderWorkoutsData(initData.workouts, targetDate);

    } catch(err) {
      hideLoader();
      sessionPwd = ''; 
      showAlert(err.message);
    }
  }

  // ================= 核心功能 (抽離繪製邏輯) =================
  
  // 為了讓 initLoad 可以重複利用渲染邏輯，特別將其拆分出來
  function renderWorkoutsData(data, date, events) {
    const list = document.getElementById('workoutList');
    if (data.length === 0) {
      list.innerHTML = '<p class="text-center text-muted py-4">今天沒有預定的訓練</p>';
      hideLoader(); return;
    }

    let html = `<h6 class="mb-2 pb-2 border-bottom text-primary fw-bold">🏋️ ${data[0].week} 訓練日</h6>`;
    data.forEach((item, i) => {
      // 暖身組顯示
      if (item.warmupWeight && item.warmupReps === 'warmup') {
        html += `<div class="warmup-block"><div class="warmup-label">🔥 暖身組</div><div class="warmup-detail">${item.warmupWeight}</div></div>`;
      }

      html += `
        <div class="p-3 border-bottom">
          <div class="d-flex justify-content-between mb-2">
            <strong class="text-dark">${item.movement}</strong> <span class="badge bg-light text-dark border">${item.set}</span>
          </div>
          <div class="row g-2 align-items-end">
            <div class="col-5">
              <span class="text-muted d-block" style="font-size: 10px;">原訂 (${item.percent || '-'})</span>
              <span class="text-primary fw-bold" style="font-size: 13px;">${item.targetWeight}kg x ${item.targetReps}</span>
            </div>
            <div class="col-3">
              <label class="text-muted small">實際重量</label>
              <input type="number" id="aw-${i}" class="form-control form-control-sm text-center" value="${item.actualWeight}">
            </div>
            <div class="col-2">
              <label class="text-muted small">次數</label>
              <input type="number" id="ar-${i}" class="form-control form-control-sm text-center" value="${item.actualReps.replace('+','')}">
            </div>
            <div class="col-2">
              <button id="btn-${i}" class="btn btn-sm ${item.isLogged === 'V' ? 'btn-success' : 'btn-primary'} w-100" onclick="doLog(${i},'${item.rowIdx}','${item.date}','${item.movement}')">${item.isLogged === 'V' ? '✅ 已儲存' : 'OK'}</button>
            </div>
          </div>
          ${item.isLogged === 'V' ? `<div class="est-1rm-display mt-2">📐 估算 1RM: <strong>${Math.round(Number(item.actualWeight) * (1 + Number(item.actualReps.replace('+','')) / 30))} kg</strong></div>` : ''}
        </div>`;
    });

    html += `
      <div class="alert alert-secondary p-3 mt-3 mb-0 border-0 rounded-3">
        <strong class="d-block mb-2 text-dark" style="font-size: 13px;">📅 將本日課表移動至其他日期：</strong>
        <div class="d-flex"><input type="date" id="newMoveDate" class="form-control form-control-sm me-2" value="${date}">
        <button class="btn btn-sm btn-outline-primary px-3" onclick="moveSchedule('${date}')">移動</button></div>
      </div>`;
    list.innerHTML = html;
    hideLoader();
  }

  let loadWorkoutsTimer = null;

  function loadWorkouts() {
    showLoader('讀取課表中...');
    clearTimeout(loadWorkoutsTimer);
    loadWorkoutsTimer = setTimeout(async () => {
      const date = document.getElementById('targetDate').value;
      try {
        const data = await fetchAPI('getProgramByDate', { targetDate: date });
        renderWorkoutsData(data, date);
      } catch(err) { hideLoader(); showAlert(err.message); }
    }, 300);
  }

  async function executeMove(oldDate, newDate) {
    showLoader('移動並合併課表中...');
    try {
      const msg = await fetchAPI('moveWorkoutDate', { oldDate, newDateStr: newDate });
      showAlert("✅ " + msg);
      document.getElementById('targetDate').value = newDate;
      allEvents = await fetchAPI('getAllPrograms');
      renderCalendar();
      loadWorkouts();
    } catch(err) { hideLoader(); showAlert('移動失敗：' + err.message); }
  }

  function moveSchedule(oldDate) {
    const newDate = document.getElementById('newMoveDate').value;
    if (!newDate || oldDate === newDate) return showAlert('請選擇一個不同的日期！');
    if (allEvents[newDate]) {
      showConfirm(`⚠️ 目標日期已有課表，確定要合併嗎？`, () => executeMove(oldDate, newDate), '確定合併');
    } else {
      executeMove(oldDate, newDate);
    }
  }

  async function executeGenerate(sd, inc, tmRatio, progType) {
    showLoader('正在生成課表與附加紀錄...');
    try {
      const msg = await fetchAPI('generateProgram', { startDateStr: sd, isIncrement: inc, tmRatio, progType });
      showAlert(msg);
      showLoader('刷新系統資料...');
      const s = await fetchAPI('getSettings');
      movements.forEach(move => {
        document.getElementById(move.id + '_1RM').value = s[move.id + '_1RM'] || 0;
        document.getElementById(move.id + '_Added').value = s[move.id + '_Added'] || 0;
      });
      allEvents = await fetchAPI('getAllPrograms');
      renderCalendar();
      await loadWorkouts();
      showTab('log', document.querySelector('.bottom-nav .nav-item')); 
      hideLoader();
    } catch(err) { hideLoader(); showAlert('產生失敗：' + err.message); }
  }

  function generate() {
    const sd = document.getElementById('startDate').value;
    const inc = document.getElementById('incCheck').checked;
    const tmRatio = document.querySelector('input[name="tmRatio"]:checked').value;
    const progType = document.querySelector('input[name="progType"]:checked').value;

    let baseDate = new Date(sd);
    let diff = baseDate.getDate() - baseDate.getDay() + (baseDate.getDay() == 0 ? -6 : 1);
    let startMonday = new Date(baseDate.setDate(diff));

    let hasOverlap = false;
    for (let i = 0; i < 28; i++) {
      let checkDate = new Date(startMonday);
      checkDate.setDate(startMonday.getDate() + i);
      let y = checkDate.getFullYear(), m = String(checkDate.getMonth() + 1).padStart(2, '0'), d = String(checkDate.getDate()).padStart(2, '0');
      if (allEvents[`${y}-${m}-${d}`]) { hasOverlap = true; break; }
    }

    if (hasOverlap) {
      showConfirm("⚠️ <strong class='text-danger'>發現衝突！</strong>\n\n選擇的區間內已有舊課表。\n繼續執行將會覆蓋衝突的部分。", () => executeGenerate(sd, inc, tmRatio, progType), '確定覆蓋');
    } else {
      executeGenerate(sd, inc, tmRatio, progType);
    }
  }

  async function doLog(i, row, d, m) {
    const awEl = document.getElementById('aw-'+i), arEl = document.getElementById('ar-'+i), btn = document.getElementById('btn-'+i);
    const aw = awEl.value, ar = arEl.value;
    btn.disabled = true; btn.innerText = '...';
    try {
      // 1. 寫入 Sheets
      const result = await fetchAPI('logWorkout', { logData: { rowIdx: row, date: d, movement: m, actualWeight: aw, actualReps: ar } });

      // 2. 更新 allEvents 的 doneCount
      if (allEvents[d]) {
        allEvents[d].doneCount += 1;
        allEvents[d].done = (allEvents[d].doneCount >= allEvents[d].sets);
      }

      // 3. 按鈕變綠色，顯示✅，恢復可點
      btn.className = 'btn btn-sm btn-success w-100';
      btn.innerText = '✅ 已儲存';
      btn.disabled = false;

      // 4. 同時更新月曆（不切換頁面）
      renderCalendar();

      // 5. 顯示估算 1RM
      if (result.est1RM && result.est1RM > 0) {
        const est1RMEl = btn.parentElement.parentElement.querySelector('.est-1rm-display');
        if (est1RMEl) {
          est1RMEl.innerHTML = `📐 估算 1RM: <strong>${Math.round(result.est1RM)} kg</strong>`;
        } else {
          btn.parentElement.insertAdjacentHTML('beforeend', `<div class="est-1rm-display mt-2">📐 估算 1RM: <strong>${Math.round(result.est1RM)} kg</strong></div>`);
        }
      }

      // 6. 檢查是否創 PR
      if (result.pr && result.pr.length > 0) {
        showPRCelebration(result.pr);
      }

    } catch(err) {
      // 寫入失敗：恢復按鈕，顯示 OK
      btn.className = 'btn btn-sm btn-primary w-100';
      btn.innerText = 'OK';
      btn.disabled = false;
      showAlert('紀錄失敗：' + err.message);
    }
  }

  async function saveSet() {
    let d = {};
    movements.forEach(m => {
      d[m.id + '_1RM'] = document.getElementById(m.id + '_1RM').value;
      d[m.id + '_Added'] = document.getElementById(m.id + '_Added').value;
    });
    showLoader('儲存設定中...');
    try {
      const msg = await fetchAPI('saveSettings', { data: d });
      hideLoader(); showAlert(msg);
    } catch(err) { hideLoader(); showAlert('儲存失敗：' + err.message); }
  }

  function renderCalendar() {
    const container = document.getElementById('calendarContainer');
    const display = document.getElementById('calMonthDisplay');
    container.innerHTML = '';
    ['日','一','二','三','四','五','六'].forEach(d => container.innerHTML += `<div class="cal-header">${d}</div>`);
    
    const year = currentCalDate.getFullYear(), month = currentCalDate.getMonth();
    display.innerText = `${year}年 ${month + 1}月`;
    const firstDay = new Date(year, month, 1).getDay(), daysInMonth = new Date(year, month + 1, 0).getDate();
    
    for(let i=0; i<firstDay; i++) container.innerHTML += `<div class="cal-day bg-light"></div>`;
    for(let d=1; d<=daysInMonth; d++) {
      let fullDate = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      let event = allEvents[fullDate];
      container.innerHTML += `
        <div class="cal-day" onclick="goToDate('${fullDate}')">
          <strong class="d-block mb-1">${d}</strong>
          ${event ? `<span class="cal-week-tag">${event.week}</span><div class="cal-event ${event.done?'cal-done':''}"><b>${event.move.split(' ')[0]}</b><br>${event.maxWeight}kg x ${event.sets}組</div>` : ''}
        </div>`;
    }
  }
  function changeMonth(dir) { currentCalDate.setMonth(currentCalDate.getMonth() + dir); renderCalendar(); }
  function goToDate(date) { document.getElementById('targetDate').value = date; showTab('log', document.querySelector('.nav-item')); loadWorkouts(); }

  // ================= PR 慶祝動畫 =================
  function showPRCelebration(prTypes) {
    const overlay = document.createElement('div');
    overlay.className = 'celebration';
    overlay.innerHTML = `
      <div class="celebration-content">
        <div style="font-size: 48px;">🎉</div>
        <h4 class="mt-3 mb-2 text-danger fw-bold">恭喜創 PR！</h4>
        <p class="text-muted">${prTypes.join(' / ')} PR</p>
        <button class="btn btn-danger w-100 mt-3" onclick="this.closest('.celebration').remove()">太棒了！</button>
      </div>`;
    document.body.appendChild(overlay);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
  }

  // ================= 統計圖表 =================
  let volumeChartInstance = null;
  let weightTrendChartInstance = null;
  let bodyweightChartInstance = null;

  async function renderStatistics() {
    const statCharts = document.getElementById('statCharts');
    const statEmpty = document.getElementById('statEmpty');
    const prList = document.getElementById('prHistoryList');

    try {
      // 載入統計數據
      const stats = await fetchAPI('getStatistics');
      const prs = await fetchAPI('getPRs');
      const bodyweights = await fetchAPI('getBodyWeight');

      // 設定日期輸入框
      document.getElementById('bodyweightDate').value = new Date().toISOString().split('T')[0];

      if (stats.summary.totalSessions === 0) {
        statCharts.style.display = 'none';
        statEmpty.style.display = 'block';
        prList.innerHTML = '<p class="text-muted small text-center py-2">尚無 PR 紀錄</p>';
        bodyweightChartInstance = null;
        return;
      }

      statCharts.style.display = 'block';
      statEmpty.style.display = 'none';

      // 統計卡片
      document.getElementById('statSessions').textContent = stats.summary.totalSessions;
      document.getElementById('statVolume').textContent = formatVolume(stats.summary.totalVolume);
      document.getElementById('statRecent').textContent = stats.summary.recentDays;
      document.getElementById('statPRs').textContent = prs.length;

      // 訓練量趨勢圖
      if (stats.volumeData.length > 0) {
        renderVolumeChart(stats.volumeData);
      }

      // 重量趨勢圖
      if (Object.keys(stats.weightTrends).length > 0) {
        renderWeightTrendChart(stats.weightTrends);
      }

      // 體重圖表
      if (bodyweights.length > 0) {
        renderBodyweightChart(bodyweights);
      } else {
        if (bodyweightChartInstance) { bodyweightChartInstance.destroy(); bodyweightChartInstance = null; }
      }

      // PR 歷史
      if (prs.length > 0) {
        const recentPRs = prs.slice(-20).reverse();
        prList.innerHTML = recentPRs.map(pr => `
          <div class="pr-history-item">
            <strong>${pr.movement}</strong> ${pr.weight}kg × ${pr.reps}
            <span class="pr-badge">${pr.type}</span>
            <div class="text-muted" style="font-size:10px;">${pr.date}</div>
          </div>`).join('');
      } else {
        prList.innerHTML = '<p class="text-muted small text-center py-2">尚無 PR 紀錄</p>';
      }

    } catch(err) {
      console.error('統計載入失敗:', err);
      statEmpty.style.display = 'block';
      statEmpty.innerHTML = `<p class="mb-0 text-danger">載入失敗：${err.message}</p>`;
    }
  }

  function renderVolumeChart(volumeData) {
    const ctx = document.getElementById('volumeChart').getContext('2d');
    if (volumeChartInstance) volumeChartInstance.destroy();

    const labels = volumeData.map(d => d.date.slice(5));
    const data = volumeData.map(d => d.volume);

    volumeChartInstance = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: '訓練總量 (重量 × 次數)',
          data: data,
          borderColor: '#0d6efd',
          backgroundColor: 'rgba(13,110,253,0.1)',
          fill: true,
          tension: 0.3,
          pointRadius: 3
        }]
      },
      options: {
        responsive: true,
        plugins: {
          title: { display: true, text: '訓練量趨勢', font: { size: 14 } },
          legend: { display: false }
        },
        scales: {
          x: { display: true, title: { display: true, text: '日期' } },
          y: { beginAtZero: true, title: { display: true, text: 'kg' } }
        }
      }
    });
  }

  function renderWeightTrendChart(weightTrends) {
    const ctx = document.getElementById('weightTrendChart').getContext('2d');
    if (weightTrendChartInstance) weightTrendChartInstance.destroy();

    const colors = { '深蹲 Squat': '#0d6efd', '肩推 Press': '#198754', '硬舉 Deadlift': '#fd7e14', '臥推 Bench': '#dc3545' };
    const datasets = [];
    const movementOrder = ['深蹲 Squat', '肩推 Press', '硬舉 Deadlift', '臥推 Bench'];

    movementOrder.forEach(move => {
      if (weightTrends[move] && weightTrends[move].length > 0) {
        datasets.push({
          label: move,
          data: weightTrends[move].map(d => ({ x: d.date, y: d.weight })),
          borderColor: colors[move],
          backgroundColor: colors[move],
          pointRadius: 4,
          tension: 0.3,
          showLine: true
        });
      }
    });

    weightTrendChartInstance = new Chart(ctx, {
      type: 'line',
      data: { datasets: datasets },
      options: {
        responsive: true,
        plugins: {
          title: { display: true, text: '各動作重量趨勢', font: { size: 14 } },
          tooltip: { mode: 'index', intersect: false }
        },
        scales: {
          x: { type: 'category', title: { display: true, text: '日期' }, labels: [...new Set(Object.values(weightTrends).flat().map(d => d.date))].sort() },
          y: { beginAtZero: false, title: { display: true, text: '重量 (kg)' } }
        }
      }
    });
  }

  function renderBodyweightChart(bodyweights) {
    const ctx = document.getElementById('bodyweightChart').getContext('2d');
    if (bodyweightChartInstance) bodyweightChartInstance.destroy();

    const sorted = bodyweights.slice().reverse();
    bodyweightChartInstance = new Chart(ctx, {
      type: 'line',
      data: {
        labels: sorted.map(d => d.date.slice(5)),
        datasets: [{
          label: '體重 (kg)',
          data: sorted.map(d => d.weight),
          borderColor: '#0caaaa',
          backgroundColor: 'rgba(12,170,170,0.1)',
          fill: true,
          tension: 0.3,
          pointRadius: 4
        }]
      },
      options: {
        responsive: true,
        plugins: {
          title: { display: true, text: '體重趨勢', font: { size: 14 } },
          legend: { display: false }
        },
        scales: {
          x: { display: true, title: { display: true, text: '日期' } },
          y: { title: { display: true, text: 'kg' } }
        }
      }
    });
  }

  // ================= 體重紀錄 =================
  async function saveBodyWeight() {
    const date = document.getElementById('bodyweightDate').value;
    const weight = document.getElementById('bodyweightValue').value;
    if (!date || !weight) return showAlert('請輸入日期與體重');

    showLoader('儲存體重中...');
    try {
      const msg = await fetchAPI('saveBodyWeight', { bodyData: { date, weight: Number(weight) } });
      hideLoader();
      showAlert(msg);
      // 重新繪製體重圖表
      renderStatistics();
    } catch(err) {
      hideLoader();
      showAlert('儲存失敗：' + err.message);
    }
  }

  // ================= 輔助函式 =================
  function formatVolume(vol) {
    if (vol >= 1000) return (vol / 1000).toFixed(1) + 'K';
    return vol.toString();
  }
</script>
