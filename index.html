<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>531 課表管理系統 - 手繪風格</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#FDFBF7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="531 課表">
  <link rel="icon" type="image/png" href="icon-512.png">
  <style>
    /* ── 手繪色調系統 ── */
    :root {
      /* 主題顏色 */
      --bg-cream:          #FDFBF7;
      --bg-panel:          #FFFFFF;
      --bg-surface:        #FFFBF5;
      --border-pencil:     #D4C4A8;
      --accent-orange:     #D95728;
      --accent-orange-dark:#C64820;
      --text-charcoal:     #2C2C2C;
      --text-dark:         #1A1A1A;
      --text-muted:        #666666;

      /* 運動專用色 */
      --squats:            #6B8C42;  /* Earthy green */
      --press:             #C69C3D;  /* Mustard yellow */
      --deadlift:          #E74C3C;  /* Bright red */
      --bench:             #9B59B6;  /* Purple */
      --extra-yellow:      #F39C12; /* Amber for better contrast */
      --extra-bg:          #FFF3E0; /* Light orange for extra set background */
      --extra-border:      #E67E22; /* Darker orange for extra set border */
    }

    * { box-sizing: border-box; }

    /* ── 紙張紋理背景 ── */
    body {
      background-color: var(--bg-cream);
      background-image:
        radial-gradient(#D4C4A8 1px, transparent 1px),
        radial-gradient(#D4C4A8 1px, transparent 1px);
      background-size: 20px 20px;
      background-position: 0 0, 10px 10px;
      padding: 0;
      margin: 0;
      font-family: 'Libre Baskerville', serif;
      font-size: 16px;
      color: var(--text-charcoal);
      min-height: 100vh;
    }

    /* ── 數字等寬 ── */
    .mono { font-family: 'Share Tech Mono', monospace; font-variant-numeric: tabular-nums; }

    .content-wrapper { max-width: 600px; margin: 0 auto; padding-bottom: 90px; }

    /* ── 卡片：手繪矩形風格 ── */
    .card {
      background: var(--bg-panel);
      border: 2px solid var(--border-pencil);
      border-radius: 8px;
      box-shadow: none;
      margin-bottom: 20px;
      position: relative;
      transform: rotate(var(--tilt, 0deg));
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      --tilt: -1deg;
      transform: rotate(var(--tilt));
      box-shadow: 4px 4px 12px rgba(212, 196, 168, 0.4);
    }

    /* 手繪邊緣效果 */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border: 1.5px solid var(--border-pencil);
      border-radius: 8px;
      pointer-events: none;
      z-index: 1;
      opacity: 0.3;
    }

    /* ── 底部控制面板：手繪風格 ── */
    .bottom-nav {
      position: fixed; bottom: 0; width: 100%;
      background: var(--bg-panel);
      border-top: 3px solid var(--accent-orange);
      display: flex; justify-content: space-around;
      padding: 10px 0; z-index: 1000;
      box-shadow: -2px 2px 8px rgba(0,0,0,0.08);
      transform: skewY(0deg);
    }
    .bottom-nav::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: repeating-linear-gradient(
        45deg,
        var(--accent-orange),
        var(--accent-orange) 10px,
        var(--accent-orange-dark) 10px,
        var(--accent-orange-dark) 20px
      );
      pointer-events: none;
    }
    .nav-item {
      text-align: center; color: var(--text-muted);
      text-decoration: none; font-size: 13px;
      flex: 1; transition: all 0.25s ease;
      position: relative; padding-top: 6px;
    }
    .nav-item .nav-icon {
      font-size: 24px; display: block; margin-bottom: 4px;
      font-weight: 700; position: relative;
    }
    .nav-item .nav-icon::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      border: 1px solid var(--accent-orange);
      border-radius: 4px;
      transition: all 0.2s ease;
    }
    .nav-item.active { color: var(--accent-orange); }
    .nav-item.active .nav-icon::before {
      background: rgba(217, 87, 40, 0.15);
    }
    .nav-item.active .nav-icon {
      color: var(--accent-orange);
    }

    /* ── 日曆：便條紙風格 ── */
    .calendar-grid {
      display: grid; grid-template-columns: repeat(7, 1fr);
      gap: 1px; background: var(--border-pencil);
      border: 2px solid var(--border-pencil);
      overflow: hidden;
    }
    #tab-cal { margin-left: 0; margin-right: 0; }
    #tab-cal .card { border-radius: 8px; box-shadow: none; }
    .cal-day {
      background: var(--bg-cream);
      min-height: 75px; padding: 6px 4px;
      font-size: 11px; position: relative;
      transition: background 0.2s ease;
    }
    .cal-day:hover {
      background: var(--bg-surface);
      transform: scale(1.02);
    }
    .cal-header {
      background: var(--accent-orange); color: #FFFFFF;
      text-align: center; font-weight: 700;
      padding: 8px 2px; font-size: 10px;
      letter-spacing: 2px; border-bottom: 2px solid var(--accent-orange-dark);
      font-family: 'Patrick Hand', cursive;
    }
    .cal-today { background: rgba(217, 87, 40, 0.15) !important; }
    .cal-today .cal-day-num {
      background: var(--accent-orange); color: #FFFFFF;
      width: 26px; height: 26px;
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 12px;
      box-shadow: 2px 2px 6px rgba(0,0,0,0.2);
    }
    .cal-day-num { font-weight: 600; font-size: 13px; display: block; margin-bottom: 4px; color: var(--text-charcoal); }
    .cal-event {
      background: rgba(255,255,255,0.5); color: var(--text-charcoal);
      border: 1.5px solid var(--border-pencil);
      padding: 4px 6px; margin-top: 2px; font-size: 9px;
      line-height: 1.1; font-weight: 600;
      transition: all 0.2s ease;
      border-radius: 12px;
    }
    .cal-event:hover {
      transform: scale(1.05);
      box-shadow: 2px 2px 6px rgba(0,0,0,0.15);
    }
    .cal-event.move-deadlift { border-color: var(--deadlift); background: rgba(168, 77, 63, 0.15); color: var(--deadlift); }
    .cal-event.move-press  { border-color: var(--press); background: rgba(198, 156, 61, 0.15); color: var(--press); }
    .cal-event.move-bench  { border-color: var(--bench); background: rgba(199, 92, 124, 0.15); color: var(--bench); }
    .cal-event.move-squat  { border-color: var(--squats); background: rgba(107, 140, 66, 0.15); color: var(--squats); }
    .cal-done {
      background: rgba(107, 140, 66, 0.15) !important; color: var(--squats) !important;
      border-color: var(--squats) !important;
      opacity: 1;
    }
    .cal-week-tag { font-size: 9px; color: var(--text-muted); display: block; margin-bottom: 1px; font-weight: 600; letter-spacing: 1px; font-family: 'Libre Baskerville', serif; }

    /* ── Loader：手繪旋轉圈 ── */
    #loader {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(253, 251, 247, 0.98); z-index: 9999; flex-direction: column;
      align-items: center; justify-content: center; border: 2px solid var(--accent-orange);
    }
    .loader-spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border-pencil);
      border-top-color: var(--accent-orange);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loaderText {
      font-family: 'Libre Baskerville', serif; font-weight: 700; color: var(--accent-orange);
      margin-top: 16px; font-size: 14px; letter-spacing: 2px;
    }

    /* ── 登入畫面：手繪風格 ── */
    #loginScreen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg-cream);
      background-image: radial-gradient(circle at center, #FDFBF7 0%, var(--bg-surface) 100%);
      z-index: 1000; display: flex;
      flex-direction: column; align-items: center; justify-content: center;
      padding: 24px;
      overflow: hidden;
    }
    .login-box {
      background: var(--bg-panel);
      padding: 48px 32px;
      border: 3px solid var(--accent-orange);
      width: 100%; max-width: 400px;
      text-align: center;
      position: relative;
      box-shadow: 8px 8px 30px rgba(217, 87, 40, 0.15);
      border-radius: 16px;
      transform: rotate(-0.5deg);
    }
    .login-box::before {
      content: ''; position: absolute; top: -3px; left: -3px; right: -3px; bottom: -3px;
      background: repeating-linear-gradient(
        45deg,
        transparent,
        transparent 10px,
        rgba(217, 87, 40, 0.1) 10px,
        rgba(217, 87, 40, 0.1) 20px
      );
      pointer-events: none;
      z-index: -1;
      border-radius: 18px;
    }
    .login-brand {
      font-family: 'Patrick Hand', cursive;
      font-size: 72px; font-weight: 700;
      color: var(--text-charcoal); line-height: 1;
      margin-bottom: 8px; letter-spacing: -3px;
    }
    .login-brand span { color: var(--accent-orange); }
    .login-subtitle {
      font-size: 14px; color: var(--text-muted);
      margin-bottom: 32px; font-weight: 600; letter-spacing: 4px;
      text-transform: uppercase; font-family: 'Libre Baskerville', serif;
    }
    .login-pwd {
      border: 2px dashed var(--border-pencil);
      border-radius: 12px;
      padding: 16px 12px;
      font-size: 20px;
      font-family: 'Share Tech Mono', monospace;
      text-align: center; letter-spacing: 6px;
      background: var(--bg-cream); color: var(--text-charcoal);
      transition: all 0.2s ease;
      width: 100%; margin-bottom: 16px;
    }
    .login-pwd:focus {
      outline: none;
      border-color: var(--accent-orange);
      box-shadow: 0 0 12px rgba(217, 87, 40, 0.25);
      background: #FFFFFF;
    }
    .login-btn {
      background: var(--accent-orange); color: #FFFFFF;
      border: 2px solid var(--accent-orange);
      border-radius: 12px; padding: 16px;
      font-size: 16px; font-weight: 700;
      font-family: 'Libre Baskerville', serif; letter-spacing: 2px;
      transition: all 0.15s ease; width: 100%;
      cursor: pointer;
      transform: rotate(-1deg);
    }
    .login-btn:hover {
      background: var(--accent-orange-dark);
      transform: rotate(0deg) scale(1.05);
      box-shadow: 4px 4px 12px rgba(0,0,0,0.15);
    }
    .login-btn:active {
      transform: rotate(-1deg) scale(0.98);
    }

    /* ── Tab 切換動畫 ── */
    .my-tab { animation: tabIn 0.3s cubic-bezier(0.25, 1, 0.5, 1); }
    @keyframes tabIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── 動作卡片：手繪氣泡風格 ── */
    .workout-card {
      border: 2px solid var(--border-pencil);
      background: var(--bg-panel);
      padding: 16px;
      margin-bottom: 12px;
      position: relative;
      border-radius: 16px;
      transform: rotate(var(--card-tilt, 0deg));
      transition: transform 0.3s ease;
    }
    .workout-card:hover {
      --card-tilt: -1.5deg;
      transform: rotate(var(--card-tilt));
    }
    /* 一般卡片：左側橙色邊條 */
    .workout-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
      background: var(--accent-orange);
      border-radius: 2px;
    }
    /* 追加組卡片：琥珀色樣式 */
    .workout-card.extra-set {
      border-color: var(--extra-border) !important;
      background: var(--extra-bg) !important;
    }
    .workout-card.extra-set::before {
      content: '' !important;
      position: absolute !important;
      left: 0 !important; top: 0 !important; bottom: 0 !important;
      width: 4px !important;
      background: var(--extra-border) !important;
      border-radius: 2px !important;
    }
    .workout-card.extra-set .workout-move-name { color: var(--extra-border) !important; }
    .workout-card.extra-set .workout-input-group input { border-color: var(--extra-border) !important; }
    .workout-card.extra-set .workout-input-group input:focus { border-color: var(--extra-border) !important; box-shadow: 0 0 8px rgba(230, 126, 34, 0.3) !important; }
    .workout-card-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px; padding-bottom: 8px;
      border-bottom: 2px dashed var(--border-pencil);
    }
    .workout-move-name { font-weight: 700; font-size: 16px; color: var(--text-charcoal); }
    .workout-set-badge {
      background: var(--border-pencil); color: var(--text-charcoal);
      padding: 4px 12px; font-size: 12px; font-weight: 700;
      letter-spacing: 1px; border-radius: 20px;
    }
    .workout-plan { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }
    .workout-plan strong { color: var(--text-charcoal); font-size: 13px; font-weight: 700; }
    .workout-plan .extra-indicator { color: var(--extra-border); font-weight: 700; }
    .workout-inputs { display: flex; gap: 10px; align-items: flex-end; }
    .workout-input-group { flex: 1; }
    .workout-input-group label {
      display: block; font-size: 13px; color: var(--text-muted);
      margin-bottom: 4px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
    }
    .workout-input-group input {
      border: 1.5px dashed var(--border-pencil);
      border-radius: 10px; padding: 12px 8px;
      text-align: center; font-size: 20px;
      font-family: 'Share Tech Mono', monospace; font-weight: 700; color: var(--text-charcoal);
      background: var(--bg-cream); width: 100%;
      transition: all 0.2s ease;
    }
    .workout-input-group input:focus {
      outline: none;
      border-color: var(--accent-orange);
      box-shadow: 0 0 8px rgba(217, 87, 40, 0.2);
      background: #FFFFFF;
    }
    .workout-btn {
      border: 2px solid var(--accent-orange); border-radius: 12px;
      padding: 14px 0; font-size: 14px; font-weight: 700;
      font-family: 'Libre Baskerville', serif;
      transition: all 0.15s ease; flex: 2;
      cursor: pointer;
      background: var(--accent-orange); color: #FFFFFF;
    }
    .workout-btn:hover {
      background: var(--accent-orange-dark);
      transform: scale(1.02);
    }
    .workout-btn.btn-log {
      background: var(--bg-panel); color: var(--accent-orange);
      border: 2px solid var(--accent-orange);
    }
    .workout-btn.btn-log:hover {
      background: rgba(217, 87, 40, 0.1);
    }
    .workout-btn.btn-done {
      background: var(--squats); color: #fff;
      border-color: var(--squats);
    }
    .workout-btn.btn-done:hover {
      background: #5a7a38;
    }
    .workout-btn.btn-syncing {
      background: var(--text-muted); animation: btnPulse 0.8s ease-in-out infinite;
    }
    @keyframes btnPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }

    /* ── 暖身組：手繪方塊 ── */
    .warmup-block {
      background: rgba(107, 140, 66, 0.1);
      border-left: 4px solid var(--squats);
      padding: 10px 14px; margin-bottom: 10px;
      font-size: 11px; position: relative;
      border-radius: 0 12px 12px 0;
    }
    .warmup-block::before {
      content: '🔥'; position: absolute; left: -8px; top: 0;
      font-size: 10px;
    }
    .warmup-label { color: var(--squats); font-weight: 700; font-size: 10px; letter-spacing: 1px; }
    .warmup-detail { color: var(--text-charcoal); margin-top: 2px; font-weight: 600; font-family: 'Share Tech Mono', monospace; }

    /* ── 1RM 顯示：手繪標記 ── */
    .est-1rm-display {
      background: rgba(217, 87, 40, 0.1); border: 1.5px solid rgba(217, 87, 40, 0.3);
      border-radius: 10px; padding: 10px 14px; margin-top: 10px;
      color: var(--accent-orange); font-size: 12px;
    }
    .est-1rm-display .mono { font-weight: 700; }

    /* ── 追加組（Set 3+） ── */
    .extra-badge {
      display: inline-block; background: var(--extra-border); color: #FFFFFF;
      font-size: 9px; font-weight: 700; padding: 2px 8px;
      border-radius: 4px; margin-left: 6px; letter-spacing: 1px;
      border: 1px solid var(--extra-border);
    }
    .extra-label {
      display: inline-block; background: rgba(230, 126, 34, 0.15); color: var(--extra-border);
      font-size: 10px; font-weight: 700; padding: 2px 8px;
      border-radius: 4px; margin-left: 6px; border: 1px solid var(--extra-border);
    }

    /* ── 加一組按鈕 ── */
    .add-extra-btn {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 10px; padding: 8px 16px;
      background: transparent; border: 2px dashed var(--accent-orange);
      border-radius: 12px; font-size: 12px; font-weight: 700;
      color: var(--accent-orange); cursor: pointer;
      transition: all 0.2s ease; width: 100%;
    }
    .add-extra-btn:hover { background: rgba(217, 87, 40, 0.1); border-style: solid; }
    .add-extra-btn:active { transform: scale(0.98); background: var(--accent-orange); color: #FFFFFF; }
    .add-extra-btn .icon { font-size: 14px; }

    /* ── 統計卡片：手繪風格式 ── */
    .stat-card {
      background: var(--bg-panel);
      border: 2px solid var(--border-pencil);
      border-radius: 12px; padding: 12px 8px;
      text-align: center; position: relative;
      transition: all 0.2s ease;
      transform: rotate(var(--stat-tilt, 0deg));
    }
    .stat-card:hover {
      --stat-tilt: -1deg;
      transform: rotate(var(--stat-tilt));
      box-shadow: 4px 4px 12px rgba(0,0,0,0.08);
    }
    .stat-card:nth-child(1) { border-top-color: var(--squats); }
    .stat-card:nth-child(2) { border-top-color: var(--press); }
    .stat-card:nth-child(3) { border-top-color: var(--deadlift); }
    .stat-card:nth-child(4) { border-top-color: var(--bench); }
    .stat-card::after {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0;
      width: 2px; background: var(--border-pencil);
    }
    .stat-card:nth-child(1)::after { background: var(--squats); }
    .stat-card:nth-child(2)::after { background: var(--press); }
    .stat-card:nth-child(3)::after { background: var(--deadlift); }
    .stat-card:nth-child(4)::after { background: var(--bench); }
    .stat-card .stat-value {
      font-size: 24px; font-weight: 700;
      color: var(--text-charcoal); margin-bottom: 2px;
      font-family: 'Share Tech Mono', monospace;
    }
    .stat-card .stat-label {
      font-size: 14px; color: var(--text-muted);
      font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    }

    /* ── 圖表容器 ── */
    .chart-container {
      background: var(--bg-panel);
      border: 2px solid var(--border-pencil);
      border-radius: 12px; padding: 10px; margin-bottom: 10px;
      position: relative;
      width: 100%;
      box-sizing: border-box;
    }
    .chart-container canvas {
      width: 100% !important;
      height: auto !important;
    }
    /* ── PR Badge ── */
    .pr-badge {
      display: inline-block; background: var(--accent-orange); color: #FFFFFF;
      border-radius: 4px; padding: 2px 10px;
      font-size: 9px; font-weight: 700; letter-spacing: 1px;
      margin-left: 6px;
    }

    /* ── PR 歷史 ── */
    .pr-history-item {
      background: var(--bg-panel);
      border-left: 3px solid var(--accent-orange);
      padding: 12px 14px; margin-bottom: 8px; font-size: 13px;
      position: relative; border-radius: 0 12px 12px 0;
    }
    .pr-history-item::before {
      content: ''; position: absolute; left: -6px; top: 12px;
      width: 6px; height: 6px; background: var(--accent-orange);
      border-radius: 50%;
    }
    .pr-history-item strong { color: var(--text-charcoal); }

    /* ── 體重區塊 ── */
    .bodyweight-section {
      background: rgba(107, 140, 66, 0.1);
      border-left: 4px solid var(--squats);
      border-radius: 12px; padding: 14px; margin-bottom: 12px;
    }

    /* ── 慶祝動畫 ── */
    .celebration {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(253, 251, 247, 0.96);
      z-index: 10000; display: flex;
      align-items: center; justify-content: center;
      border: 4px solid var(--accent-orange);
    }
    .celebration-content {
      background: var(--bg-panel);
      border: 3px solid var(--accent-orange);
      border-radius: 20px; padding: 40px 28px;
      text-align: center; max-width: 300px;
      box-shadow: 12px 12px 40px rgba(217, 87, 40, 0.2);
      animation: celebrationBounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes celebrationBounce {

    /* ── 設定頁 ── */

    /* ── 密碼修改區塊 ── */

    /* ── 生成頁 ── */
    .gen-option { background: var(--bg-panel); padding: 14px; border: 2px solid var(--border-pencil); border-radius: 12px; margin-bottom: 10px; }
    .gen-option label { font-weight: 700; font-size: 13px; color: var(--text-charcoal); display: block; margin-bottom: 8px; letter-spacing: 1px; }

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  let currentCalDate = new Date();
  let allEvents = {};
  const movements = [
    {id: 'Squat', name: 'Squat'}, {id: 'OverheadPress', name: 'Press'},
    {id: 'Deadlift', name: 'Deadlift'}, {id: 'BenchPress', name: 'Bench'}
  ];

  let sessionPwd = '';

  // ═══════ API — deep module ═══════
  // Interface: post(action, data) → result.data
  // Implementation hides: URL, auth injection, 8s timeout, 1-retry on network/5xx, error classification

  class AuthError extends Error { constructor(msg) { super(msg); this.name = 'AuthError'; } }
  class ValidationError extends Error { constructor(msg) { super(msg); this.name = 'ValidationError'; } }
  class NetworkError extends Error { constructor(msg) { super(msg); this.name = 'NetworkError'; } }

  const API = {
    _url: 'https://script.google.com/macros/s/AKfycbwOrHQPT_x5EtWMGVRx2fW0Qs1CZlTU4yB-vbyqYDTX0lOqK8Vp3sd6H74rqu_Kui414w/exec',
    _timeout: 8000,
    _maxRetries: 1,

    _classify: function(result) {
      var code = result.error_code;
      var msg = result.error || 'Unknown Error';
      if (code === 'AUTH_ERROR' || (!code && (msg.toLowerCase().includes('password') || msg.includes('密碼')))) throw new AuthError(msg);
      if (code === 'VALIDATION_ERROR' || (!code && (msg.toLowerCase().includes('unknown') || msg.includes('未知')))) throw new ValidationError(msg);
      throw new Error(msg);
    },

    _request: async function(action, data) {
      const payload = { action: action, password: sessionPwd, ...data };
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), this._timeout);

      try {
        const res = await fetch(this._url, {
          method: 'POST',
          body: JSON.stringify(payload),
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          signal: controller.signal
        });
        clearTimeout(timer);

        if (!res.ok) {
          if (res.status >= 500) throw new NetworkError('Server Error: ' + res.status);
          throw new NetworkError('HTTP ' + res.status);
        }

        const result = await res.json();
        if (!result.success) this._classify(result);
        return result.data;
      } catch (err) {
        clearTimeout(timer);
        if (err instanceof NetworkError || err.name === 'AbortError') {
          throw err;
        }
        throw err;
      }
    },

    post: async function(action, data) {
      let lastErr;
      for (let attempt = 0; attempt <= this._maxRetries; attempt++) {
        try {
          return await this._request(action, data);
        } catch (err) {
          lastErr = err;
          if (err.name === 'AuthError' || err.name === 'ValidationError') throw err;
          if (attempt < this._maxRetries) continue;
        }
      }
      throw lastErr;
    }
  };

  // ═══════ Tab 配置 — deep module ═══════
  var TABS = ['log', 'cal', 'gen', 'set', 'stat'];

  var TAB_HOOKS = {
    'cal': function() { renderCalendar(); },
    'stat': function() { renderStatistics(); }
  };

  function showTab(id, el) {
    TABS.forEach(function(t) {
      var tab = document.getElementById('tab-' + t);
      if (tab) tab.style.display = (t === id) ? 'block' : 'none';
    });
    document.querySelectorAll('.nav-item').forEach(function(n) { n.classList.remove('active'); });
    el.classList.add('active');
    if (TAB_HOOKS[id]) TAB_HOOKS[id]();
  }

  // ═══════ UI 共用 ═══════
  let appModal = null;
  function getAppModal() {
    if (!appModal) {
      appModal = new bootstrap.Modal(document.getElementById('customModal'));
    }
    return appModal;
  }
  window.addEventListener('DOMContentLoaded', () => {
    appModal = new bootstrap.Modal(document.getElementById('customModal'));
    renderSettingsUI();
    document.getElementById('targetDate').value = getLocalDateString();
    document.getElementById('startDate').value = getLocalDateString();
  });

  function showAlert(msg) {
    if (!appModal) getAppModal();
    document.getElementById('customModalBody').innerHTML = msg;
    document.getElementById('customModalFooter').innerHTML = '<button type="button" class="btn btn-navy w-100" data-bs-dismiss="modal">確定</button>';
    appModal.show();
  }

  function showConfirm(msg, confirmCallback, btnText = '確定') {
    if (!appModal) getAppModal();
    document.getElementById('customModalBody').innerHTML = msg;
    document.getElementById('customModalFooter').innerHTML = `
      <button type="button" class="btn btn-light border w-100 mb-2" data-bs-dismiss="modal">取消</button>
      <button type="button" class="btn btn-navy w-100 m-0" id="modalConfirmBtn">${btnText}</button>`;
    document.getElementById('modalConfirmBtn').onclick = function() { appModal.hide(); confirmCallback(); };
    appModal.show();
  }

  function showLoader(text = '處理中...') { document.getElementById('loaderText').innerText = text; document.getElementById('loader').style.display = 'flex'; }
  function hideLoader() { document.getElementById('loader').style.display = 'none'; }

  // ═══════ 設定 UI ═══════
  function renderSettingsUI() {
    const colorMap = { 'Squat': 'squat-color', 'OverheadPress': 'press-color', 'Deadlift': 'deadlift-color', 'BenchPress': 'bench-color' };
    let html = '';
    movements.forEach(m => {
      html += `
      <div class="setting-item">
        <div class="setting-item-header ${colorMap[m.id]}" data-move="${m.name.toUpperCase()}">${m.name}</div>
        <div class="row g-2">
          <div class="col-6">
            <label class="form-label-sm">基礎 1RM</label>
            <input type="number" class="w-100 mono" id="${m.id}_1RM">
          </div>
          <div class="col-6">
            <label class="form-label-sm">累計增加</label>
            <input type="number" class="w-100 mono text-accent" id="${m.id}_Added">
          </div>
        </div>
      </div>`;
    });
    document.getElementById('settingsContainer').innerHTML = html;
  }

  // ═══════ 登入 ═══════
  async function doLogin() {
    const pwdInput = document.getElementById('loginPwd').value;
    if(!pwdInput) return showAlert('請輸入密碼');

    showLoader('驗證並載入資料中 (約需 2~3 秒)...');
    sessionPwd = pwdInput;
    const targetDate = document.getElementById('targetDate').value || getLocalDateString();

    try {
      const initData = await API.post('initLoad', { targetDate: targetDate });

      document.getElementById('loginScreen').style.opacity = '0';
      document.getElementById('loginScreen').style.transition = 'opacity 0.3s ease';
      setTimeout(() => {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
      }, 300);

      movements.forEach(m => {
        document.getElementById(m.id + '_1RM').value = initData.settings[m.id + '_1RM'] || 0;
        document.getElementById(m.id + '_Added').value = initData.settings[m.id + '_Added'] || 0;
      });

      allEvents = initData.events;
      renderCalendar();
      renderWorkoutsData(initData.workouts, targetDate);

    } catch(err) {
      hideLoader();
      sessionPwd = '';
      showAlert(err.message);
    }
  }

  // ═══════ 動作紀錄渲染 ── 手繪風格 ═══════
  function renderWorkoutsData(data, date, events) {
    const list = document.getElementById('workoutList');
    if (data.length === 0) {
      list.innerHTML = '<div class="empty-state">今天沒有預定的訓練</div>';
      hideLoader(); return;
    }

    let html = `<h6 class="section-title" style="margin-bottom:14px; color: var(--accent-orange);">${data[0].week}</h6>`;

    data.forEach((item, i) => {
      // 暖身組
      if (item.warmupWeight && item.warmupReps === 'warmup') {
        html += `<div class="warmup-block"><div class="warmup-label">🔥 暖身組</div><div class="warmup-detail">${item.warmupWeight}</div></div>`;
      }

      // 判斷是否為追加組
      var setStr = String(item.set || '').trim();  // 移除前後空白
      var isSet3 = setStr === 'Set 3';
      var isExtra = setStr.startsWith('Set 3') && setStr.length > 5;

      // 調試信息
      console.log('Workout Item:', item.movement, '| Set:', item.set, '| Trimmed:', setStr, '| isExtra:', isExtra, '| length:', setStr.length);

      html += `
        <div class="workout-card${isExtra ? ' extra-set' : ''}" data-set="${setStr}" data-isextra="${isExtra}">
          <div class="workout-card-header">
            <span class="workout-move-name">${item.movement}${isExtra ? '<span class="extra-label">⚡ 追加組</span>' : ''}</span>
            <span class="workout-set-badge mono">${setStr}${isExtra ? '<span class="extra-badge">追加</span>' : ''}</span>
          </div>
          <div class="workout-plan">
            ${item.targetWeight ? '原訂 <strong>' + item.targetWeight + 'kg × ' + item.targetReps + '</strong> <span class="text-muted-custom" style="font-size:11px;">(' + item.percent + ')</span>' : '<span style="font-size:12px; color: var(--extra-border); font-weight: 700;">⚡ 追加組 — 無原訂重量/次數</span>'}
          </div>
          <div class="workout-inputs">
            <div class="workout-input-group" style="flex:1.5;">
              <label>重量</label>
              <input type="number" id="aw-${i}" class="mono" value="${item.actualWeight}">
            </div>
            <div class="workout-input-group" style="flex:1;">
              <label>次數</label>
              <input type="number" id="ar-${i}" class="mono" value="${item.actualReps.replace('+','')}">
            </div>
            <div class="workout-input-group" style="flex:4.5;">
              <label>&nbsp;</label>
              <button id="btn-${i}" class="workout-btn ${item.isLogged === 'V' ? 'btn-done' : 'btn-log'}" onclick="doLog(${i}, '${item.rowIdx}', '${item.date}', '${item.movement}', '${item.set}')">${item.isLogged === 'V' ? '✅ 已儲存' : 'OK'}</button>
            </div>
          </div>
          ${item.isLogged === 'V' ? `<div class="est-1rm-display">📐 估算 1RM: <span class="mono"><strong>${item.est1RM > 0 ? Math.round(item.est1RM) : '-'}</strong> kg</span></div>` : ''}
                   ${isSet3 && item.isLogged === 'V' ? '<button class="add-extra-btn" data-date="' + item.date + '" data-movement="' + item.movement + '" onclick="doAddExtraSet(\'' + item.date + '\',\'' + item.movement + '\',this,\'' + item.actualWeight + '\',\'' + item.actualReps + '\')"><span class="icon">+</span> 加一組</button>' : ''}
        </div>`;
    });

    // 統計追加組數量
    var extraCount = {};
    data.forEach(function(item) {
      var setStr = String(item.set || '').trim();
      if (setStr.startsWith('Set 3') && setStr.length > 5) {
        var key = item.date + '|' + item.movement;
        extraCount[key] = (extraCount[key] || 0) + 1;
      }
    });
    // 移動課表
    html += `
      <div class="move-date-box">
        <strong class="d-block mb-2" style="font-size:13px; color: var(--text-charcoal);">📅 將本日課表移動至其他日期</strong>
        <div class="d-flex gap-2">
          <input type="date" id="newMoveDate" class="flex-grow-1 mono" value="${date}" style="margin:0;">
          <button class="btn btn-navy py-2 px-3" onclick="moveSchedule('${date}')">移動</button>
        </div>
      </div>`;

    list.innerHTML = html;
    hideLoader();

    // 設置追加組按鈕的 data-extra-count 屬性 (在 HTML 渲染後)
    document.querySelectorAll('.add-extra-btn').forEach(function(btn) {
      var key = btn.getAttribute('data-date') + '|' + btn.getAttribute('data-movement');
      var remaining = 5 - (extraCount[key] || 0);
      btn.setAttribute('data-extra-count', extraCount[key] || 0);
      if (remaining <= 0) {
        btn.style.display = 'none';
      } else {
        btn.innerHTML = '<span class="icon">+</span> 加一組 (剩 ' + remaining + ' 組)';
      }
    });
  }

  let loadWorkoutsTimer = null;
  function loadWorkouts() {
    showLoader('讀取課表中...');
    clearTimeout(loadWorkoutsTimer);
    loadWorkoutsTimer = setTimeout(async () => {
      const date = document.getElementById('targetDate').value;
      try {
        const data = await API.post('getProgramByDate', { targetDate: date });
        renderWorkoutsData(data, date);
      } catch(err) { hideLoader(); showAlert(err.message); }
    }, 300);
  }

  async function executeMove(oldDate, newDate) {
    showLoader('移動並合併課表中...');
    try {
      const msg = await API.post('moveWorkoutDate', { oldDate, newDateStr: newDate });
      showAlert("✅ " + msg);
      document.getElementById('targetDate').value = newDate;
      allEvents = await API.post('getAllPrograms');
      renderCalendar();
      loadWorkouts();
    } catch(err) { hideLoader(); showAlert('移動失敗： ' + err.message); }
  }

  function moveSchedule(oldDate) {
    const newDate = document.getElementById('newMoveDate').value;
    if (!newDate || oldDate === newDate) return showAlert('請選擇一個不同的日期');
    if (allEvents[newDate]) {
      showConfirm(`⚠️ <strong class='text-accent'>發現衝突！</strong>\n\n目標日期已有課表，確定要合併嗎？`, () => executeMove(oldDate, newDate), '確定合併');
    } else {
      executeMove(oldDate, newDate);
    }
  }

  async function executeGenerate(sd, inc, tmRatio, progType) {
    showLoader('正在生成課表與附加紀錄...');
    try {
      const msg = await API.post('generateProgram', { startDateStr: sd, isIncrement: inc, tmRatio, progType });
      showAlert(msg);
      showLoader('刷新系統資料...');
      const s = await API.post('getSettings');
      movements.forEach(move => {
        document.getElementById(move.id + '_1RM').value = s[move.id + '_1RM'] || 0;
        document.getElementById(move.id + '_Added').value = s[move.id + '_Added'] || 0;
      });
      allEvents = await API.post('getAllPrograms');
      renderCalendar();
      await loadWorkouts();
      showTab('log', document.querySelector('.bottom-nav .nav-item'));
      hideLoader();
    } catch(err) { hideLoader(); showAlert('產生失敗: ' + err.message); }
  }

  async function generate() {
    const sd = document.getElementById('startDate').value;
    const inc = document.getElementById('incCheck').checked;
    const tmRatio = document.querySelector('input[name="tmRatio"]:checked').value;
    const progType = document.querySelector('input[name="progType"]:checked').value;

   let mondayStr = await API.post('calcNextMonday', { date: sd });
   let [y, m, d] = mondayStr.split('-');
   let startMonday = new Date(+y, +m - 1, +d);

    let hasOverlap = false;
    for (let i = 0; i < 28; i++) {
      let checkDate = new Date(startMonday);
      checkDate.setDate(startMonday.getDate() + i);
      let checkDateStr = getLocalDateString(checkDate);
      if (allEvents[checkDateStr]) { hasOverlap = true; break; }
    }

    if (hasOverlap) {
      showConfirm("⚠️ <strong class='text-accent'>發現衝突！</strong>\n\n選擇的區間內已有舊課表。\n繼續執行將會覆蓋衝突的部分。", () => executeGenerate(sd, inc, tmRatio, progType), '確定覆蓋');
    } else {
      executeGenerate(sd, inc, tmRatio, progType);
    }
  }

  async function doLog(i, row, d, m, set) {
    const awEl = document.getElementById('aw-'+i), arEl = document.getElementById('ar-'+i), btn = document.getElementById('btn-'+i);
    const card = btn.closest('.workout-card');
    const aw = awEl.value, ar = arEl.value;

    // 樂觀更新
    const prevClassName = btn.className;
    const prevText = btn.innerText;
    const prevDone = allEvents[d] ? { ...allEvents[d] } : null;

    btn.className = 'workout-btn btn-done btn-syncing';
    btn.innerText = '✅ 儲存中...';
    btn.disabled = true;

    if (allEvents[d]) {
      allEvents[d].doneCount += 1;
      allEvents[d].done = (allEvents[d].doneCount >= allEvents[d].sets);
    }
    renderCalendar();

    // 背景寫入 API
    let result;
    try {
      result = await API.post('logWorkout', { logData: { rowIdx: row, date: d, movement: m, set: set, actualWeight: aw, actualReps: ar } });
    } catch(err) {
      btn.className = prevClassName;
      btn.innerText = prevText;
      btn.disabled = false;
      if (prevDone) {
        allEvents[d] = prevDone;
        renderCalendar();
      }
      showAlert('紀錄失敗：' + err.message);
      return;
    }

    btn.className = 'workout-btn btn-done';
    btn.innerText = '✅ 已儲存';
    btn.disabled = false;

    if (result.est1RM && result.est1RM > 0) {
      const est1RMEl = card.querySelector('.est-1rm-display');
      if (est1RMEl) {
        est1RMEl.innerHTML = `📐 估算 1RM: <span class="mono"><strong>${Math.round(result.est1RM)}</strong> kg</span>`;
      } else {
        card.insertAdjacentHTML('beforeend', `<div class="est-1rm-display">📐 估算 1RM: <span class="mono"><strong>${Math.round(result.est1RM)}</strong> kg</span></div>`);
      }
    }

    if (result.pr && result.pr.length > 0) {
      showPRCelebration(result.pr);
    }

    // 檢查是否是 Set 3 且已儲存，若是則動態生成「加一組」按鈕
    var setStr = String(set || '').trim();
    if (setStr === 'Set 3' && !card.querySelector('.add-extra-btn')) {
      card.insertAdjacentHTML('beforeend', `<button class="add-extra-btn" data-date="${d}" data-movement="${m}" data-extra-count="0" onclick="doAddExtraSet('${d}','${m}',this,'${aw}','${ar}')"><span class="icon">+</span> 加一組 (剩 5 組)</button>`);
    }
  }

  // ── 為 Set 3 追加一組 ──
  function doAddExtraSet(date, movement, btnEl, defaultWeight, defaultReps) {
    var w = Number(defaultWeight) || 0;
    var r = Number(defaultReps) || 0;

    btnEl.disabled = true;
    btnEl.innerHTML = '<span class="icon">⏳</span> 儲存中...';

    API.post('addExtraSet', {
      logData: { date: date, movement: movement, actualWeight: w, actualReps: r }
    }).then(function(result) {
      btnEl.innerHTML = '<span class="icon">+</span> 加一組';
      loadWorkouts();
    }).catch(function(err) {
      btnEl.disabled = false;
      btnEl.innerHTML = '<span class="icon">+</span> 加一組';
    });
  }

  async function saveSet() {
    let d = {};
    movements.forEach(m => {
      d[m.id + '_1RM'] = document.getElementById(m.id + '_1RM').value;
      d[m.id + '_Added'] = document.getElementById(m.id + '_Added').value;
    });
    showLoader('SAVING CONFIGURATION...');
    try {
      const msg = await API.post('saveSettings', { data: d });
      hideLoader(); showAlert(msg);
    } catch(err) { hideLoader(); showAlert('儲存失敗：' + err.message); }
  }

  // ═══════ 日曆 ── 手繪風格 ═══════
  function renderCalendar() {
    const container = document.getElementById('calendarContainer');
    const display = document.getElementById('calMonthDisplay');
    container.innerHTML = '';
    ['日','一','二','三','四','五','六'].forEach(d => container.innerHTML += `<div class="cal-header">${d}</div>`);

    const year = currentCalDate.getFullYear(), month = currentCalDate.getMonth();
    display.innerText = `${year} / ${month + 1}`;
    const firstDay = new Date(year, month, 1).getDay(), daysInMonth = new Date(year, month + 1, 0).getDate();
    const today = new Date();
    const todayStr = getLocalDateString(today);

    for(let i=0; i<firstDay; i++) container.innerHTML += `<div class="cal-day" style="background:transparent;"></div>`;
    for(let d=1; d<=daysInMonth; d++) {
      let fullDate = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      let event = allEvents[fullDate];
      let isToday = fullDate === todayStr ? ' cal-today' : '';
      let moveClass = '';
      if (event) {
        const mv = event.move || '';
        if (mv.includes('深蹲') || mv.includes('Squat')) moveClass = 'move-squat';
        else if (mv.includes('硬舉') || mv.includes('Deadlift')) moveClass = 'move-deadlift';
        else if (mv.includes('肩推') || mv.includes('Press')) moveClass = 'move-press';
        else if (mv.includes('臥推') || mv.includes('Bench')) moveClass = 'move-bench';
      }
      container.innerHTML += `
        <div class="cal-day${isToday}" onclick="goToDate('${fullDate}')">
          <strong class="cal-day-num">${d}</strong>
          ${event ? `<span class="cal-week-tag">${event.week}</span><div class="cal-event ${moveClass} ${event.done?'cal-done':''}"><b>${event.move.split(' ')[0]}</b><br>${event.maxWeight}kg × ${event.sets} SETS</div>` : ''}
        </div>`;
    }
  }
  function changeMonth(dir) {
    currentCalDate.setDate(1);
    currentCalDate.setMonth(currentCalDate.getMonth() + dir);
    renderCalendar();
  }
  function goToDate(date) { document.getElementById('targetDate').value = date; showTab('log', document.querySelector('.nav-item')); loadWorkouts(); }

  // ═══════ PR 慶祝 ── 手繪風格 ═══════
  function showPRCelebration(prTypes) {
    const overlay = document.createElement('div');
    overlay.className = 'celebration';
    overlay.innerHTML = `
      <div class="celebration-content">
        <div style="font-size: 52px;">🎉</div>
        <h4 class="mt-3 mb-2 text-accent fw-bold">恭喜創 PR!</h4>
        <p style="color:var(--text-muted)">${prTypes.join(' / ')} 紀錄</p>
        <button class="btn btn-accent w-100 mt-3 py-2" onclick="this.closest('.celebration').remove()">太棒了</button>
      </div>`;
    document.body.appendChild(overlay);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
  }

  // ═══════ 統計 ═══════
  let chartInstances = {};

  async function renderStatistics() {
    const statCharts = document.getElementById('statCharts');
    const statEmpty = document.getElementById('statEmpty');
    const prList = document.getElementById('prHistoryList');

    showLoader('載入統計資料中...');

    try {
      const stats = await API.post('getStatistics');
      const prs = await API.post('getPRs');
      const bodyweights = await API.post('getBodyWeight');

      document.getElementById('bodyweightDate').value = getLocalDateString();

      if (stats.summary.totalSessions === 0) {
        hideLoader();
        statCharts.style.display = 'none';
        statEmpty.style.display = 'block';
        prList.innerHTML = '<p class="text-muted-custom small text-center py-2">尚無 PR 紀錄</p>';
        chartInstances.bodyweight = null;
        return;
      }

      statCharts.style.display = 'block';
      statEmpty.style.display = 'none';

      document.getElementById('statSessions').textContent = stats.summary.totalSessions;
      document.getElementById('statVolume').textContent = formatVolume(stats.summary.totalVolume);
      document.getElementById('statRecent').textContent = stats.summary.recentDays;
      document.getElementById('statPRs').textContent = prs.length;

      if (Object.keys(stats.volumeTrends).length > 0) {
        ChartService.renderTrendChart('volumeChart', stats.volumeTrends, '各動作訓練量趨勢', true);
      }
      if (Object.keys(stats.weightTrends).length > 0) {
        ChartService.renderTrendChart('weightTrendChart', stats.weightTrends, '各動作最大重量趨勢', false);
      }
      if (bodyweights.length > 0) {
        ChartService.renderBodyweight('bodyweightChart', bodyweights);
      } else {
        if (chartInstances.bodyweight) { chartInstances.bodyweight.destroy(); chartInstances.bodyweight = null; }
      }

      const prByMove = {};
      prs.forEach(pr => {
        if (!prByMove[pr.movement] || pr.weight > prByMove[pr.movement].weight) {
          prByMove[pr.movement] = pr;
        }
      });
      const bestPRs = Object.values(prByMove).sort((a, b) => b.weight - a.weight);
      if (bestPRs.length > 0) {
        prList.innerHTML = bestPRs.map(pr => `
          <div class="pr-history-item">
            <strong>${pr.movement}</strong> <span class="mono" style="color:var(--accent-orange); font-weight:700; font-size:14px;">${pr.weight}kg × ${pr.reps}</span>
            <span class="pr-badge">${pr.type}</span>
            <div style="color:var(--text-muted);font-size:10px;">${pr.date}</div>
          </div>`).join('');
      } else {
        prList.innerHTML = '<p class="text-muted-custom small text-center py-2">尚無 PR 紀錄</p>';
      }

      hideLoader();

    } catch(err) {
      hideLoader();
      console.error('STATS LOAD FAILED:', err);
      statEmpty.style.display = 'block';
      statEmpty.innerHTML = `<p class="mb-0 text-accent">載入失敗: ${err.message}</p>`;
    }
  }

  // ═══════ ChartService — deep module ═══════
  // Updated for hand-drawn style - white bg with charcoal text
  const ChartService = {
    _colors: { '深蹲 Squat': '#6B8C42', '肩推 Press': '#C69C3D', '硬舉 Deadlift': '#E74C3C', '臥推 Bench': '#9B59B6' },
    _movementOrder: ['深蹲 Squat', '肩推 Press', '硬舉 Deadlift', '臥推 Bench'],
    _chartOptions: {
      responsive: true,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        title: { display: true, font: { size: 15, weight: '700', family: "'Libre Baskerville', serif" }, color: '#2C2C2C' },
        legend: { labels: { usePointStyle: true, padding: 16, font: { size: 12, family: "'Libre Baskerville', serif" }, color: '#2C2C2C' } },
        tooltip: {
          backgroundColor: 'rgba(44, 44, 44, 0.95)',
          titleFont: { family: "'Share Tech Mono', monospace", color: '#FFFFFF' },
          bodyFont: { family: "'Share Tech Mono', monospace", color: '#FFFFFF' },
          cornerRadius: 8, padding: 10, borderColor: '#D4C4A8', borderWidth: 1
        }
      },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 10, family: "'Share Tech Mono', monospace" }, color: '#2C2C2C', maxRotation: 45 }, border: { display: false, color: '#D4C4A8' } },
        y: { grid: { color: 'rgba(212, 196, 168, 0.3)' }, ticks: { font: { size: 12, family: "'Share Tech Mono', monospace" }, color: '#2C2C2C' }, border: { display: false, color: '#D4C4A8' } }
      }
    },

    _buildDatasets: function(trends) {
      const datasets = [];
      const allDates = new Set();
      this._movementOrder.forEach(move => {
        if (trends[move]) Object.keys(trends[move]).forEach(d => allDates.add(d));
      });
      const sortedDates = [...allDates].sort();

      this._movementOrder.forEach(move => {
        if (trends[move] && Object.keys(trends[move]).length > 0) {
          datasets.push({
            label: move,
            data: sortedDates.map(d => ({ x: d, y: trends[move][d] || null })),
            borderColor: this._colors[move], backgroundColor: this._colors[move],
            pointRadius: 4, pointHoverRadius: 6,
            borderWidth: 2.5, tension: 0.3, spanGaps: true
          });
        }
      });
      return { datasets, sortedDates };
    },

    renderTrendChart: function(canvasId, trends, title, beginAtZero) {
      const ctx = document.getElementById(canvasId).getContext('2d');
      if (chartInstances[canvasId]) chartInstances[canvasId].destroy();

      const { datasets, sortedDates } = this._buildDatasets(trends);

      // Deep clone _chartOptions to avoid mutation
      const baseOptions = JSON.parse(JSON.stringify(this._chartOptions));

      chartInstances[canvasId] = new Chart(ctx, {
        type: 'line',
        data: { datasets: datasets },
        options: {
          ...baseOptions,
          plugins: {
            ...baseOptions.plugins,
            title: { display: true, text: title, font: { size: 15, weight: '700', family: "'Libre Baskerville', serif" }, color: '#2C2C2C' },
            legend: { labels: { usePointStyle: true, padding: 16, font: { size: 12, family: "'Libre Baskerville', serif" }, color: '#2C2C2C' } }
          },
          scales: {
            x: {
              ...baseOptions.scales.x,
              type: 'category',
              labels: sortedDates,
              ticks: { ...baseOptions.scales.x.ticks, color: '#2C2C2C' }
            },
            y: {
              ...baseOptions.scales.y,
              beginAtZero: beginAtZero,
              ticks: { ...baseOptions.scales.y.ticks, color: '#2C2C2C' }
            }
          }
        }
      });
    },

    renderBodyweight: function(canvasId, bodyweights) {
      const ctx = document.getElementById(canvasId).getContext('2d');
      if (chartInstances[canvasId]) chartInstances[canvasId].destroy();

      const sorted = bodyweights.slice().reverse();
      chartInstances[canvasId] = new Chart(ctx, {
        type: 'line',
        data: {
          labels: sorted.map(d => d.date),
          datasets: [{
            label: '體重 (kg)', data: sorted.map(d => d.weight),
            borderColor: '#6B8C42', backgroundColor: 'rgba(107, 140, 66, 0.1)',
            fill: true, tension: 0.3,
            pointRadius: 4, pointHoverRadius: 6, borderWidth: 2.5
          }]
        },
        options: {
          ...this._chartOptions,
          plugins: {
            ...this._chartOptions.plugins,
            title: { display: true, text: '體重趨勢', font: { size: 15, weight: '700', family: "'Libre Baskerville', serif" }, color: '#2C2C2C' },
            legend: { display: false }
          },
          scales: {
            x: {
              ...this._chartOptions.scales.x,
              grid: { display: false },
              ticks: { 
                ...this._chartOptions.scales.x.ticks,
                color: '#2C2C2C',
                border: { display: false },
                maxRotation: 45,
                minRotation: 45
              }
            },
            y: {
              ...this._chartOptions.scales.y,
              grid: { color: 'rgba(212, 196, 168, 0.3)' },
              ticks: { ...this._chartOptions.scales.y.ticks, color: '#2C2C2C', border: { display: false } }
            }
          }
        }
      });
    }
  };

  // ═══════ 體重紀錄 ═══════
  async function saveBodyWeight() {
    const date = document.getElementById('bodyweightDate').value;
    const weight = document.getElementById('bodyweightValue').value;
    if (!date || !weight) return showAlert('請輸入日期與體重');

    showLoader('儲存體重中...');
    try {
      const msg = await API.post('saveBodyWeight', { bodyData: { date, weight: Number(weight) } });
      hideLoader();
      showAlert(msg);
      renderStatistics();
    } catch(err) {
      hideLoader();
      showAlert('儲存失敗：' + err.message);
    }
  }

  // ═══════ 密碼修改 ═══════
  async function changePassword() {
    const oldPwd = document.getElementById('oldPwd').value;
    const newPwd = document.getElementById('newPwd').value;
    const confirmPwd = document.getElementById('confirmPwd').value;

    if (!oldPwd || !newPwd || !confirmPwd) return showAlert('請填寫所有欄位');
    if (newPwd !== confirmPwd) return showAlert('兩次輸入的新密碼不一致');
    if (newPwd.length < 4) return showAlert('密碼至少需要 4 個字元');

    showLoader('更新密碼中...');
    try {
      const msg = await API.post('changePassword', { oldPassword: oldPwd, newPassword: newPwd });
      hideLoader();
      showAlert(msg);
      document.getElementById('oldPwd').value = '';
      document.getElementById('newPwd').value = '';
      document.getElementById('confirmPwd').value = '';
    } catch(err) {
      hideLoader();
      showAlert('密碼更新失敗: ' + err.message);
    }
  }

  // ═══════ 輔助 ═══════
  function formatVolume(vol) {
    if (vol >= 1000) return (vol / 1000).toFixed(1) + 'K';
    return vol.toString();
  }

  // 本地日期字串 (yyyy-MM-dd)，避免 toISOString() 回傳 UTC 日期
  function getLocalDateString(d) {
    const date = d || new Date();
    return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
  }

  // ═══════ PWA Service Worker ═══════
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js?v=31', { scope: './' })
        .then((reg) => { console.log('SW 已註冊:', reg.scope); })
        .catch((err) => { console.log('SW 註冊失敗:', err); });
    });
  }

  // ═══════ PWA 安裝提示 ── 手繪風格 ═══════
  let deferredPrompt = null;

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    setTimeout(() => {
      if (!document.querySelector('#installBanner')) {
        const banner = document.createElement('div');
        banner.id = 'installBanner';
        banner.style.cssText = 'position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--accent-orange);color:#FFFFFF;padding:12px 20px;border-radius:12px;z-index:9998;box-shadow:4px 4px 12px rgba(217,87,40,0.3);font-size:13px;display:flex;align-items:center;gap:10px;max-width:90%;font-family:"Libre Baskerville",serif;';
        banner.innerHTML = `
          <span>📲 新增至主畫面，快速開啟課表</span>
          <button id="installBtn" class="btn btn-sm" style="background:#FFFFFF;color:var(--accent-orange);font-weight:700;border:2px solid var(--accent-orange);padding:4px 14px;border-radius:8px;">安裝</button>
          <button id="installClose" style="background:none;border:none;color:#FFFFFF;font-size:18px;padding:4px 8px;cursor:pointer;">✕</button>`;
        document.body.appendChild(banner);

        document.getElementById('installBtn').addEventListener('click', async () => {
          banner.remove();
          if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            deferredPrompt = null;
            console.log('安裝結果:', outcome);
          }
        });

        document.getElementById('installClose').addEventListener('click', () => {
          banner.remove();
        });
      }
    }, 5000);
  });
</script>
</body>
</html>
